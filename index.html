<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les Chroniques d'Al-Qamar</title>
<style>
:root{--or:#c9962b;--or2:#f0d27a;--mer:#1b2f6b;--mer2:#2c4a9e;--grenat:#8c1d2f;--parch:#f3e6c4;--parch2:#e6d3a3;--encre:#2a1d10}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--mer);color:var(--encre);font-family:"Trebuchet MS",Verdana,sans-serif;font-size:20px}
body{background:radial-gradient(circle at 50% 0,#2c4a9e,#101b44 70%) fixed}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:.2em 0}
#app{max-width:900px;margin:0 auto;padding:14px}
.carte{background:var(--parch);border:5px double var(--or);border-radius:10px;padding:18px;box-shadow:0 6px 18px #0008}
.titre{text-align:center;color:var(--or2);text-shadow:0 3px 0 #000a}
.titre h1{font-size:2.4em}.titre p{font-size:1.1em;margin:0 0 10px}
.menu{display:grid;gap:12px;margin:14px 0}
button{font:inherit;font-size:1em;padding:12px 18px;border-radius:8px;border:3px solid var(--or);background:var(--mer2);color:#fff;cursor:pointer;text-align:left}
button:hover:not(:disabled){background:var(--grenat)}
button:focus-visible{outline:4px solid var(--or2)}
button:disabled{opacity:.55;cursor:not-allowed}
.petit{font-size:.8em;padding:8px 12px}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:#fff;margin-bottom:10px}
.tour{background:var(--or);color:var(--encre);padding:8px 16px;border-radius:30px;font-weight:bold;border:3px solid var(--or2)}
.tour.othman{background:var(--grenat);color:#fff}
.sac span{background:#0006;padding:6px 10px;border-radius:8px;margin-right:6px;display:inline-block}
.plateau{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border:10px solid var(--grenat);outline:4px solid var(--or);border-radius:6px;background:var(--parch2);width:100%}
.case{aspect-ratio:1;border:1px solid #8a6d2f88;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.case:nth-child(odd){background:#ecd9a8}.case:hover{background:#fff6;}
.case.gris{filter:grayscale(1)}
.case.dest::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:var(--or);opacity:.5}
.pion{width:90%;height:90%;display:flex;align-items:flex-end;justify-content:center;gap:0;z-index:2}
.pion svg{width:100%;height:100%}
.dialogue{display:flex;gap:14px;align-items:flex-start}
.portrait{width:96px;flex:none;background:var(--mer);border:4px solid var(--or);border-radius:10px;padding:4px}
.portrait svg{width:100%;display:block}
.nom{font-weight:bold;color:var(--grenat)}
.texte{line-height:1.5;font-size:1.1em}
.choix{display:grid;gap:10px;margin:14px 0}
.choix button{background:#fff8e6;color:var(--encre);border-color:var(--mer2)}
.choix button:hover:not(:disabled){background:var(--or2)}
.choix button.bon{background:#2e7d32;color:#fff}.choix button.mauvais{background:var(--grenat);color:#fff}
.retour{border-left:6px solid var(--or);padding:8px 12px;margin:10px 0;background:#fff7;border-radius:4px}
.retour.ok{border-color:#2e7d32}.retour.ko{border-color:var(--grenat)}
.pagination{color:#fff;opacity:.85;text-align:center;font-size:.8em;margin-top:12px}
.medaille{font-size:2em;text-align:center}
@media(max-width:600px){html,body{font-size:17px}.portrait{width:70px}}
@media(prefers-reduced-motion:no-preference){.pion{transition:transform .15s}}
.jauge{background:#0004;border:3px solid var(--or);border-radius:20px;height:22px;overflow:hidden;margin:6px 0}
.jauge i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2))}
.onglets{display:flex;gap:10px;margin-bottom:10px}.onglets button.sel{background:var(--or);color:var(--encre)}
.epreuve{border-top:3px double var(--or);margin-top:14px;padding-top:8px}
.entree{background:#fff8;border-radius:6px;padding:8px 12px;margin:8px 0;font-size:.9em;line-height:1.45}
.entree.ok{border-left:6px solid #2e7d32}.entree.ko{border-left:6px solid var(--grenat)}
.revoir{background:var(--grenat);color:#fff;border-radius:12px;padding:2px 10px;font-size:.8em}
textarea{width:100%;height:90px;font:14px monospace;border:3px solid var(--or);border-radius:6px;padding:6px}

.choix button.bon{background:#2e7d32;color:#fff}.choix button.mauvais{background:#d98a1f;color:#2a1d10}
.retour.ko,.entree.ko{border-color:#d98a1f}
.choix button b{display:inline-block;width:1.7em;height:1.7em;line-height:1.7em;text-align:center;border-radius:50%;background:var(--or);color:var(--encre);margin-right:10px}
.niv{min-width:160px;font-size:.8em}.petitej{height:12px;margin:3px 0 0}
#mute{position:fixed;top:8px;right:8px;z-index:50;text-align:center}
.tourcarte{text-align:center}.tourcarte .portrait{margin:0 auto 10px;width:120px}
.tourcarte.badr{border-color:var(--mer2)}.tourcarte.othman{border-color:var(--grenat)}
.spark{position:fixed;width:10px;height:10px;border-radius:50%;background:radial-gradient(#fff,var(--or2));pointer-events:none;z-index:99;animation:jaillir .9s ease-out forwards}
@keyframes jaillir{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes trem{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fondu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:no-preference){.tremble{animation:trem .4s}#app>*{animation:fondu .35s}}

.plateau{background:var(--c1,#e6d3a3)}.case:nth-child(odd){background:var(--c2,#ecd9a8)}.case:hover{background:#fff8!important}
.deco{font-size:1.7em;opacity:.85}
.case.pnj::before{content:"▼";position:absolute;top:-4px;color:var(--or);font-size:1.3em;z-index:3;text-shadow:0 1px 0 #000a}
.arene{display:flex;justify-content:space-around;align-items:center;gap:8px;text-align:center}.camp{flex:1}
.pionD{width:100px;margin:0 auto}.pionD svg{width:100%;display:block}.pionD .pion{height:auto}
.vs{font:bold 1.6em Georgia,serif;color:var(--grenat)}
.braise{width:90px;margin:0 auto 8px}.braise svg{width:100%}
.nofade>*{animation:none!important}
@media(prefers-reduced-motion:no-preference){.braise svg{animation:vacille 1.2s infinite alternate}.case.pnj::before{animation:saute .8s infinite alternate}}
@keyframes vacille{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.08) rotate(2deg)}}
@keyframes saute{to{transform:translateY(-5px)}}

.carte{position:relative}.carte::before,.carte::after{content:"✦";position:absolute;color:var(--or);font-size:22px;line-height:1;text-shadow:0 1px 0 #0006}
.carte::before{top:-3px;left:5px}.carte::after{bottom:-3px;right:5px}
.case:nth-child(n){background-image:linear-gradient(45deg,#0001 25%,transparent 25% 75%,#0001 75%),linear-gradient(45deg,#0001 25%,transparent 25% 75%,#0001 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.deco{width:80%}.item{width:55%;filter:drop-shadow(0 0 6px #f0d27a)}.deco svg,.item svg{width:100%;display:block}
.ico{display:inline-block;width:38px;vertical-align:middle}.ico svg{width:100%;display:block}
.mini{display:inline-block;width:30px;vertical-align:middle}.mini svg{width:100%;display:block}
.barre{text-decoration:line-through}
.ciel{position:fixed;left:0;right:0;top:0;height:120px;pointer-events:none;z-index:0}#app{position:relative;z-index:1}
.ciel circle{animation:scint 3s infinite alternate}@keyframes scint{from{opacity:.25}to{opacity:1}}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--parch);border:3px solid var(--or);border-radius:30px;padding:8px 18px;z-index:100;box-shadow:0 4px 12px #0008;max-width:90%;text-align:center;animation:toast 2s forwards}
@keyframes toast{0%{opacity:0;top:90px}10%,85%{opacity:1;top:70px}100%{opacity:0}}
@media(prefers-reduced-motion:no-preference){.plateau .pion svg{animation:respire 1.4s ease-in-out infinite alternate}.item{animation:respire 1s ease-in-out infinite alternate}}
@keyframes respire{to{transform:translateY(-3px)}}

/* itération 4 : sol seul grisé, textures par scène, horizon, décors à découvrir */
.case,.case:nth-child(n),.case:hover{background:none!important}
.case{isolation:isolate}
.sol{position:absolute;inset:0;z-index:-1;background:var(--tex),var(--c1)}
.case:nth-child(odd) .sol{background:var(--tex),var(--c2)}
.case:hover .sol{box-shadow:inset 0 0 0 99px #fff4}
.deco.neuf{filter:drop-shadow(0 0 5px #f0d27a)}
.horizon{height:64px;border:10px solid var(--grenat);border-bottom:0;border-radius:6px 6px 0 0;overflow:hidden}.horizon svg{width:100%;height:100%;display:block}
.affiche{display:flex;justify-content:center;align-items:flex-end;gap:14px}.affiche .m{width:90px}.affiche .lune{width:120px}.affiche svg{width:100%;display:block}
@media(prefers-reduced-motion:no-preference){.affiche .m{animation:respire 2.2s ease-in-out infinite alternate}}

.illus{width:150px;margin:8px auto}.illus svg{width:100%;display:block;border:2px solid var(--or);border-radius:4px;background:#fff}
.defi{margin:6px 0}.defi.ok{opacity:.8}
.petit.sel{background:var(--or);color:var(--encre);border-color:var(--grenat)}
</style>
</head>
<body>
<div class="ciel" id="ciel"></div>
<div id="app"></div>
<button id="mute" class="petit" aria-label="Son"></button>

<!-- Pour charger toute la banque de 72 questions : crée à côté de ce fichier
     questions-acte1.js (le fichier fourni, qui définit QUESTIONS_ACTE_1) -->
<script src="questions-acte1.js" onerror="void 0"></script>
<script>
"use strict";
/* ============================ DONNÉES ============================ */
// Banque intégrée (repli) : épreuve T01 seulement pour l'itération 1.
const QUESTIONS_EMBED={trials:[{id:"T01",scene:"Scène 1 — Le Serment des Cartographes",object:"Boussole-Rose",notion:"Lire une carte : légende, rose des vents, continents",questions:[
{id:"T01-Q1",othman:{enonce:"Sur une carte du monde, combien vois-tu de grands continents ?",choix:["3","6","10"],reponse:1,explication:"Il y a 6 continents : l'Afrique, l'Amérique du Nord, l'Amérique du Sud, l'Antarctique, l'Asie (avec l'Europe) et l'Océanie."},badr:{enonce:"Quelle est la différence entre un continent et un océan ?",choix:["Le continent est en pierre, l'océan en eau salée","Le continent est une immense étendue de terre, l'océan une immense étendue d'eau salée","Il n'y a aucune différence"],reponse:1,explication:"Un continent est une vaste étendue de terre émergée ; un océan est une vaste étendue d'eau salée. La Terre compte 6 continents et 5 océans."}},
{id:"T01-Q2",othman:{enonce:"La petite flèche qui indique le Nord sur une carte s'appelle...",choix:["La rose des vents","La fleur de sel","L'étoile du sud"],reponse:0,explication:"La rose des vents indique les directions (Nord, Sud, Est, Ouest) sur une carte."},badr:{enonce:"Que trouve-t-on dans la légende d'une carte ?",choix:["L'histoire du pays","La signification des symboles et des couleurs","La liste des habitants"],reponse:1,explication:"La légende explique ce que signifient les symboles, couleurs et tracés d'une carte : capitales, fleuves, montagnes, frontières."}},
{id:"T01-Q3",othman:{enonce:"Sur quelle carte verrais-tu la Tour Eiffel ?",choix:["La carte de la France","La carte du Japon","La carte du Maroc"],reponse:0,explication:"La Tour Eiffel se trouve à Paris, la capitale de la France, en Europe."},badr:{enonce:"Sur une carte, à quoi reconnaît-on la capitale d'un pays ?",choix:["Elle est écrite en très petit","Elle est souvent marquée d'un point ou d'une étoile et écrite en gras","Elle est dessinée en rouge partout"],reponse:1,explication:"Par convention cartographique, la capitale est signalée par un symbole distinct (point, étoile) et son nom en graissé."}}
]}]};
const BANQUE=(typeof QUESTIONS_ACTE_1!=="undefined"&&QUESTIONS_ACTE_1.trials)?QUESTIONS_ACTE_1:QUESTIONS_EMBED;
const trial=id=>BANQUE.trials.find(t=>t.id===id);

const JOUEURS={
 badr:{nom:"Badr",titre:"Badr le Stratège",fam:"Nimrod",couleur:"#1b2f6b",lettre:"B"},
 othman:{nom:"Othman",titre:"Othman le Lunaliste",fam:"Selene",couleur:"#8c1d2f",lettre:"O"}
};
const COUP_DUR=[ // conséquences narratives d'une erreur
 "L'Encre Noire s'étend un instant sur la carte, puis recule. Les lignes pâlissent.",
 "Un fragment de parchemin se froisse dans ta main. Le Bibliothécaire lève un sourcil, patient.",
 "Une ombre d'encre glisse sur le sol, mais ton familier la repousse. Réessaie !",
 "La Boussole-Rose tremble et perd le Nord une seconde. Retrouve ton calme."
];

/* ============================ SVG (figurines) ============================ */
const SVG={
 nimrod:`<svg viewBox="0 0 64 64"><path d="M14 20l-6-14 14 8zM50 20l6-14-14 8z" fill="#c9962b"/><path d="M12 24l4-12 10 8zM52 24l-4-12-10 8z" fill="#dfe9f5" stroke="#1b2f6b" stroke-width="2"/><ellipse cx="32" cy="36" rx="22" ry="20" fill="#e8f0fa" stroke="#1b2f6b" stroke-width="2.5"/><path d="M32 18l-6 10h12z" fill="#9fb8e0"/><circle cx="23" cy="34" r="3.5" fill="#2c7fd1"/><circle cx="41" cy="34" r="3.5" fill="#2c7fd1"/><ellipse cx="32" cy="45" rx="9" ry="7" fill="#fff" stroke="#1b2f6b" stroke-width="2"/><circle cx="32" cy="42" r="2.6" fill="#1b2f6b"/><g fill="#b9cdea"><circle cx="18" cy="46" r="2"/><circle cx="46" cy="46" r="2"/><circle cx="24" cy="52" r="2"/><circle cx="40" cy="52" r="2"/></g></svg>`,
 selene:`<svg viewBox="0 0 64 64"><path d="M2 20c12-8 16 0 16 14-8 0-14-4-16-14zM62 20c-12-8-16 0-16 14 8 0 14-4 16-14z" fill="#c9962b" stroke="#6b4a10" stroke-width="2"/><path d="M14 22l2-16 12 10zM50 22l-2-16-12 10z" fill="#3a2a6b" stroke="#c9962b" stroke-width="2"/><ellipse cx="32" cy="36" rx="19" ry="18" fill="#3a2a6b" stroke="#c9962b" stroke-width="2.5"/><circle cx="24" cy="33" r="4" fill="#f0d27a"/><circle cx="40" cy="33" r="4" fill="#f0d27a"/><path d="M24 29v8M40 29v8" stroke="#2a1d10" stroke-width="2"/><path d="M29 41h6l-3 4z" fill="#e58ea0"/><g fill="#f0d27a"><circle cx="18" cy="44" r="1.5"/><circle cx="46" cy="44" r="1.5"/><circle cx="32" cy="24" r="1.5"/><circle cx="25" cy="50" r="1.5"/><circle cx="39" cy="50" r="1.5"/></g></svg>`,
 biblio:`<svg viewBox="0 0 64 64"><path d="M6 62c0-22 12-30 26-30s26 8 26 30z" fill="#1b2f6b" stroke="#c9962b" stroke-width="2.5"/><circle cx="32" cy="24" r="12" fill="#f0d9b0" stroke="#6b4a10" stroke-width="2"/><path d="M20 28c2 18 22 18 24 0-4 8-20 8-24 0z" fill="#fff"/><path d="M18 20c2-12 26-12 28 0-6-4-22-4-28 0z" fill="#c9962b"/><circle cx="27" cy="23" r="2" fill="#2a1d10"/><circle cx="37" cy="23" r="2" fill="#2a1d10"/></svg>`,
 pion:(c)=>`<svg viewBox="0 0 64 64"><ellipse cx="32" cy="56" rx="22" ry="6" fill="#0005"/><circle cx="32" cy="50" r="18" fill="${c}" stroke="#c9962b" stroke-width="3"/></svg>`
};
function figurine(j){ // pion du joueur : base + lettre + familier
 const J=JOUEURS[j],fam=SVG[J.fam.toLowerCase()];
 return `<div class="pion" title="${J.titre}"><svg viewBox="0 0 64 64"><ellipse cx="32" cy="58" rx="24" ry="5" fill="#0005"/><circle cx="26" cy="38" r="18" fill="${J.couleur}" stroke="#c9962b" stroke-width="3"/><text x="26" y="46" font-size="24" font-weight="bold" fill="#f0d27a" text-anchor="middle" font-family="Georgia,serif">${J.lettre}</text><g transform="translate(36 10) scale(.45)">${fam.replace(/<svg[^>]*>|<\/svg>/g,"")}</g></svg></div>`;
}

/* ============================ SAUVEGARDE (base) ============================ */
const CLE="alqamar_v1";
function neuf(){return{actif:"badr",or:0,objets:[],etapes:{},opt:{son:true},collecte:{},sagesse:0,potions:0,parch:[],joueurs:{badr:{xp:0,grimoire:[]},othman:{xp:0,grimoire:[]}}}}
function compl(o){o.opt=o.opt||{son:true};o.collecte=o.collecte||{};o.sagesse=o.sagesse|0;o.potions=o.potions|0;o.parch=o.parch||[];o.vu=o.vu||{};return o}
function charger(){try{const s=JSON.parse(localStorage.getItem(CLE));if(s&&s.joueurs)return compl(s);return neuf()}catch(e){return neuf()}}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(E))}catch(e){}}
let E=charger();
let hero={x:0,y:4},verrou=false;

/* ============================ SONS, NIVEAUX, EFFETS (itération 2) ============================ */
let AC=null;
function audio(){if(!E.opt.son)return null;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}catch(e){return null}}
function note(f,t0,d,type,vol){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type||"sine";o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
const SON={
 ok(){[784,988,1319].forEach((f,i)=>note(f,i*.09,.5,"triangle",.15))},   // cristal
 ko(){note(330,0,.35,"sine",.12);note(262,.15,.5,"sine",.1)},            // doux, jamais strident
 tour(){note(660,0,1.1,"sine",.14);note(1320,0,.9,"sine",.05)},          // cloche
 page(){note(220,0,.1,"sawtooth",.03);note(170,.05,.12,"sawtooth",.03)}, // page tournée
 victoire(){[523,659,784,1047].forEach((f,i)=>note(f,i*.14,.7,"triangle",.16))}
};
function majMute(){document.getElementById("mute").textContent=E.opt.son?"🔊":"🔇"}
document.getElementById("mute").onclick=()=>{E.opt.son=!E.opt.son;sauver();majMute();if(E.opt.son)SON.ok()};
majMute();
function parler(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
const TITRES=["Écuyer","Chevalier","Sage","Légende d'Al-Qamar"],PALIER=30;
function niveau(j){const xp=E.joueurs[j].xp,n=Math.floor(xp/PALIER)+1;return{n,titre:TITRES[Math.min(3,Math.floor((n-1)/2))],reste:xp%PALIER}}
function gagnerXP(j,x){const a=niveau(j).n;E.joueurs[j].xp+=x;return niveau(j).n>a} // vrai si niveau gagné
function etincelles(el){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const r=el.getBoundingClientRect();
 for(let i=0;i<16;i++){const s=document.createElement("i"),a=Math.random()*6.28,d=40+Math.random()*70;s.className="spark";
  s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function ecranTour(cb){const j=E.actif,J=JOUEURS[j];SON.tour();
 ecran(`<div class="carte tourcarte ${j}"><div class="portrait">${SVG[J.fam.toLowerCase()]}</div><h2>C'est ton tour, ${J.nom} !</h2><p class="texte">${J.titre} — ${J.fam} t'attend.</p><button id="go">Je suis prêt !</button></div>`);
 document.getElementById("go").onclick=cb}

/* ============================ ILLUSTRATIONS (images des corrections) ============================ */
const FL=c=>`<svg viewBox="0 0 90 60">${c}</svg>`,B3=(a,b,c)=>`<rect width="30" height="60" fill="${a}"/><rect x="30" width="30" height="60" fill="${b}"/><rect x="60" width="30" height="60" fill="${c}"/>`,H3=(a,b,c)=>`<rect width="90" height="20" fill="${a}"/><rect y="20" width="90" height="20" fill="${b}"/><rect y="40" width="90" height="20" fill="${c}"/>`;
const ILLUS={
 japon:FL('<rect width="90" height="60" fill="#fff"/><circle cx="45" cy="30" r="17" fill="#bc002d"/>'),
 maroc:FL('<rect width="90" height="60" fill="#c1272d"/><path d="M45 13l7 26-22-16h30L38 39z" fill="none" stroke="#006233" stroke-width="2.5"/>'),
 italie:FL(B3("#009246","#fff","#ce2b37")),france:FL(B3("#0055a4","#fff","#ef4135")),belgique:FL(B3("#000","#fae042","#ed2939")),
 allemagne:FL(H3("#000","#dd0000","#ffce00")),
 danemark:FL('<rect width="90" height="60" fill="#c8102e"/><rect x="26" width="9" height="60" fill="#fff"/><rect y="25" width="90" height="10" fill="#fff"/>'),
 pologne:FL('<rect width="90" height="30" fill="#fff"/><rect y="30" width="90" height="30" fill="#dc143c"/>'),
 canada:FL('<rect width="90" height="60" fill="#fff"/><rect width="22" height="60" fill="#d52b1e"/><rect x="68" width="22" height="60" fill="#d52b1e"/><path d="M45 14l5 10 9-3-3 11 6 3-11 3v9h-12v-9l-11-3 6-3-3-11 9 3z" fill="#d52b1e"/>'),

const alea=n=>Math.floor(Math.random()*n);
function melanger(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=alea(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function autreJoueur(){E.actif=E.actif==="badr"?"othman":"badr"}

// Enregistre la question dans le Grimoire du joueur ; renvoie vrai si niveau gagné.
function noter(j,q,t,v,sa,bon){E.joueurs[j].grimoire.push({q:q.id,essai:E.joueurs[j].grimoire.length+1,trial:t.id,notion:t.notion,enonce:v.enonce,sa,bonne:v.libre?"(discussion libre)":v.choix[v.reponse],explication:v.explication,illus:v.illus||q.illus||null,ok:bon});
 const m=gagnerXP(j,bon?5+(E.objets.includes("Épée-Boussole")?1:0):2);sauver();return m}

// Affiche UNE question. apres(bon) renvoie {label,go,txt?,auto?} : ce que fait le bouton de suite.
function poserQ(q,t,j,prefix,apres){
 const v=q[j];
 if(v.libre){ // question ouverte : pas de bonne ou mauvaise réponse
  ecran(`${prefix}<div class="carte"><h3>${t.scene}</h3><p class="nom">${JOUEURS[j].nom}, à toi de raconter</p><p class="texte">${v.enonce}</p><textarea id="lib" placeholder="Écris ici, ou raconte à voix haute…"></textarea><p class="texte">📖 ${v.explication}</p><button id="disc">Nous en avons discuté</button></div>`);
  document.getElementById("disc").onclick=()=>{noter(j,q,t,v,document.getElementById("lib").value||"(discuté à voix haute)",true);apres(true).go()};return}
 const ordre=melanger(v.choix.map((_,i)=>i));
 ecran(`${prefix}<div class="carte"><h3>${t.scene}</h3><p class="nom">Question pour ${JOUEURS[j].nom}</p><p class="texte">${v.enonce} <button class="petit" id="lire">🔊</button></p>
  <div class="choix" id="choix">${ordre.map((i,k)=>`<button data-i="${i}"><b>${"ABCD"[k]}</b>${v.choix[i]}</button>`).join("")}</div><div id="retour"></div></div>`);
 document.getElementById("lire").onclick=()=>parler(v.enonce);
 if(E.sagesse>0){document.getElementById("lire").insertAdjacentHTML("afterend",` <button class="petit" id="ind">💡 Indice (💎 ${E.sagesse})</button>`);
  document.getElementById("ind").onclick=ev=>{const l=[...document.querySelectorAll("#choix button:not([disabled])")].filter(x=>+x.dataset.i!==v.reponse);if(!l.length||E.sagesse<1)return;
   const x=l[alea(l.length)];x.disabled=true;x.classList.add("barre");E.sagesse--;sauver();ev.target.remove();toast("💎 Une mauvaise réponse est écartée",1.8)}}
 document.querySelectorAll("#choix button").forEach(b=>b.onclick=()=>{
  const i=+b.dataset.i,bon=i===v.reponse;
  document.querySelectorAll("#choix button").forEach(x=>{x.disabled=true;if(+x.dataset.i===v.reponse)x.classList.add("bon")});
  if(!bon){b.classList.add("mauvais");document.getElementById("choix").closest(".carte").classList.add("tremble");SON.ko()}else{SON.ok();etincelles(b)}
  const mont=noter(j,q,t,v,v.choix[i],bon),r=apres(bon);
  document.getElementById("retour").innerHTML=`<div class="retour ${bon?"ok":"ko"}"><b>${bon?"✨ Étincelle ravivée !":"L'Encre Noire s'agite…"}</b><br>${bon?"":COUP_DUR[alea(COUP_DUR.length)]+"<br>"}${mont?`🎉 <b>Niveau ${niveau(j).n} : ${niveau(j).titre} !</b><br>`:""}<i>${JOUEURS[j].fam} : « ${bon?"Bravo, on avance !":"On réessaie ensemble !"} »</i><br>📖 ${bon?"":"<b>Leçon : </b>"}${v.explication}${v.astuce?`<br>💡 <i>${v.astuce}</i>`:""}${(v.illus||q.illus)?`<div class="illus">${ILLUS[v.illus||q.illus]||""}</div>`:""}${r.txt?`<br><b>${r.txt}</b>`:""}</div><button id="suite">${r.label}</button>`;
  let fait=false;const go=()=>{if(fait)return;fait=true;r.go()};
  document.getElementById("suite").onclick=go;if(r.auto)setTimeout(go,r.auto);
 });
}

// Épreuve : 3 réussites tirées d'une réserve de 6 questions (notions ratées d'abord, puis jamais vues). Les erreurs deviennent une leçon.
function lancerEpreuve(id,fin){
 const t=trial(id),pool=t.questions.map(q=>({q,ok:false,vu:false})),need=Math.min(3,pool.length),rates=[];
 let bonnes=0,erreurs=0,derniere=null,pardon=false,libreFait=false;
 const libre=p=>p.q.badr.libre||p.q.othman.libre;
 function fini(){const m=erreurs===0?"or":erreurs===1?"argent":"bronze";rates.length?lecon(rates,()=>fin(m)):fin(m)}
 function suivante(){
  if(bonnes>=need)return fini();
  let c=pool.filter(p=>!p.ok&&p.q.id!==derniere);if(!c.length)c=pool.filter(p=>!p.ok);
  if(!libreFait){const f=c.filter(libre);if(f.length)c=f}else{const nl=c.filter(p=>!libre(p));if(nl.length)c=nl}
  const vus=new Set(E.joueurs[E.actif].grimoire.map(e=>e.q)),rv=revoir(E.actif),nv=c.filter(p=>!p.vu);
  const tier=[nv.filter(p=>rv.includes(p.q.id)),nv.filter(p=>!vus.has(p.q.id)),nv,c].find(a=>a.length);
  const p=tier[alea(tier.length)];p.vu=true;derniere=p.q.id;if(libre(p))libreFait=true;
  poserQ(p.q,t,E.actif,hud(1),bon=>{if(bon){p.ok=true;bonnes++}else{rates.push({j:E.actif,q:p.q,v:p.q[E.actif]});if(E.objets.includes("Cape-Lune")&&!pardon)pardon=true;else erreurs++}
   return{label:bonnes>=need?"Terminer l'épreuve":"Question suivante",go:()=>{autreJoueur();sauver();bonnes>=need?suivante():ecranTour(suivante)}}});
 }
 suivante();
}
// Leçon de l'Encre : l'échec devient un savoir (corrigé, illustré, +3 XP, et la notion revient en priorité).
function lecon(rates,suite){
 SON.page();
 ecran(`${hud(1)}<div class="carte"><h2>📖 Leçon de l'Encre</h2><p class="texte">Une erreur comprise est un savoir gagné. Ces notions reviendront en priorité dans vos Grimoires.</p>${rates.map(r=>{const v=r.v,ill=v.illus||r.q.illus;return `<div class="entree ko"><b>${JOUEURS[r.j].nom} — ${v.enonce}</b><br>✅ ${v.choix[v.reponse]}<br>📖 ${v.explication}${v.astuce?`<br>💡 ${v.astuce}`:""}${ill?`<div class="illus">${ILLUS[ill]||""}</div>`:""}</div>`}).join("")}<p class="texte">🎓 +3 XP par leçon comprise</p><button id="ok">J'ai compris !</button></div>`);
 document.getElementById("ok").onclick=()=>{rates.forEach(r=>gagnerXP(r.j,3));E.lecons=(E.lecons|0)+rates.length;sauver();SON.ok();verifierDefis();suite()};
}

// Concours chronométré : chaque question est posée aux DEUX frères (6 questions), 60 s, chronomètre désactivable.
function lancerConcours(id,fin){
 const t=trial(id),L=[];melanger(t.questions).slice(0,3).forEach(q=>["badr","othman"].forEach(j=>L.push({q,j})));
 const chrono=E.opt.chrono!==false;let i=0,bonnes=0,reste=60,tm=null,fini=false;
 const clore=()=>{if(fini)return;fini=true;clearInterval(tm);fin(bonnes,L.length)};
 function suiv(){
  if(fini)return;if(i>=L.length||(chrono&&reste<=0))return clore();
  const {q,j}=L[i++];E.actif=j;
  poserQ(q,t,j,`${hud(1)}<div class="hud"><div class="tour">${chrono?`⏱️ <span id="chrono">${reste}</span> s`:"Sans chronomètre"} · question ${i}/${L.length}</div></div>`,bon=>{if(bon)bonnes++;return{label:"Suite",auto:1100,go:suiv}});
 }
 if(chrono)tm=setInterval(()=>{reste--;const c=document.getElementById("chrono");if(c)c.textContent=reste;if(reste<=0)clore()},1000);
 SON.corne();suiv();
}

// Duel (version minimale) : 3 manches, un frère à chaque manche ; le Pion d'Encre a 2 cœurs, l'équipe 3.
function lancerDuel(id,fin){
 const t=trial(id);let pvP,pvN,m,ordre;
 const coeurs=(n,max,c)=>c.repeat(Math.max(0,n))+"🖤".repeat(max-Math.max(0,n));
 const ent=()=>{const j=E.actif;return `<div class="carte duel"><h3>⚔️ ${t.scene} — manche ${m+1}/3</h3><div class="arene"><div class="camp"><div class="pionD">${figurine(j)}</div>${JOUEURS[j].nom}<br>${coeurs(pvP,3,"❤️")}</div><div class="vs">VS</div><div class="camp"><div class="pionD">${SVG.encre}</div>Pion d'Encre<br>${coeurs(pvN,2,"💜")}</div></div></div>`};
 function debut(){pvP=3;pvN=2;m=0;ordre=melanger(t.questions);SON.corne();manche()}
 function manche(){
  if(m>=3||pvN<=0||pvP<=0)return bilan();
  ecran(`${hud(1)}${ent()}<div class="carte"><p class="texte">Choisis ton action, puis réponds à la question pour la réussir :</p><div class="choix"><button data-a="att">🗡️ Attaquer — blesse le Pion</button><button data-a="def">🛡️ Défendre — soigne un cœur</button><button data-a="esq">💨 Esquiver — évite la riposte</button>${E.potions>0&&pvP<3?`<button id="pot">🧪 Boire une potion : +1 cœur (×${E.potions})</button>`:""}</div></div>`);
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>question(b.dataset.a));const pb=document.getElementById("pot");if(pb)pb.onclick=()=>{E.potions--;pvP++;sauver();SON.ok();manche()};
 }
 function question(a){
  poserQ(ordre[m],t,E.actif,`${hud(1)}${ent()}`,bon=>{
   let txt;
   if(bon){if(a==="att"){pvN--;txt="Ton coup touche le Pion d'Encre !"}else if(a==="def"){pvP=Math.min(3,pvP+1);txt="Ton bouclier t'abrite et te soigne."}else txt="Tu esquives en un éclair !"}
   else txt="Ton action échoue, l'Encre Noire s'agite.";
   if(pvN>0&&!(bon&&a==="esq")){pvP--;txt+=" Le Pion riposte : un cœur s'éteint."}
   return{txt,label:"Manche suivante",go:()=>{m++;autreJoueur();sauver();(pvN<=0||m>=3||pvP<=0)?bilan():ecranTour(manche)}}});
 }
 function bilan(){
  if(pvN<=0)return fin(pvP>=2?"or":pvP===1?"argent":"bronze");
  ecran(`${hud(1)}${ent()}<div class="carte"><h2>Repli stratégique</h2><p class="texte">Le Pion d'Encre recule dans un tourbillon, mais il se reforme déjà. Reprenez votre souffle : l'Encre Noire n'est jamais invincible face à deux frères unis.</p><button id="retry">Retenter le duel</button></div>`);
  document.getElementById("retry").onclick=debut;
 }
 debut();
}

function revoir(j){const m={};E.joueurs[j].grimoire.forEach(e=>m[e.q]=e.ok);return Object.keys(m).filter(k=>!m[k])}
function maitrisees(j){const m={};E.joueurs[j].grimoire.forEach(e=>m[e.q]=e.ok);return Object.values(m).filter(Boolean).length}
const totalQ=()=>BANQUE.trials.reduce((n,t)=>n+t.questions.length,0);
function ouvrirGrimoire(j){
 SON.page();j=j||E.actif;const back=RETOUR||accueil,g=E.joueurs[j].grimoire,rv=revoir(j),pct=Math.round(100*maitrisees(j)/totalQ());

 <p class="texte">📜 ${g.length} page(s) écrite(s) · ✨ ${maitrisees(j)} / ${totalQ()} savoirs maîtrisés · 🔁 ${rv.length} à revoir</p>
 <div class="jauge"><i style="width:${pct}%"></i></div><p>Complétion : ${pct} %</p>`;
 if(!g.length)h+=`<p class="texte">Ton Grimoire est vide. Chaque question répondue y écrira une page.</p>`;

  h+=`<div class="epreuve"><h3>${t.scene} ${med[E.etapes[t.id]]||""} ${aR?'<span class="revoir">à revoir</span>':""}</h3><div>Notion : ${t.notion}</div>`+
  es.map(e=>`<div class="entree ${e.ok?"ok":"ko"}"><b>${e.ok?"✅":"❌"} ${e.enonce}</b><br>Ta réponse : ${e.sa}${e.ok?"":`<br>Bonne réponse : ${e.bonne}`}<br>📖 ${e.explication}${e.illus?`<div class="illus">${ILLUS[e.illus]||""}</div>`:""}</div>`).join("")+`</div>`});
 ecran(h+`</div><div class="pagination"><button class="petit" id="r">← Retour</button></div>`);
 document.getElementById("r").onclick=back;
}

  ecran(`<div class="carte"><div class="dialogue"><div class="portrait">${SVG[l.img]}</div><div><div class="nom">${l.qui}</div><p class="texte" id="tx"></p></div></div>

  const tx=document.getElementById("tx");let n=0,fait=false;

 })();

 ${CHAPITRES().map(c=>{const l=ETAPES.filter(e=>e.scene===c),f=l.filter(e=>E.etapes[e.id]).length;return `<div class="entree ${f===l.length?"ok":""}">${f===l.length?"✅":cur&&cur.scene===c?"▶️":"⬜"} ${DECORS[c].nom} (${f}/${l.length})</div>`}).join("")}
 <p class="texte">🎯 ${cur?"Prochain objectif : <b>"+cur.obj+"</b>":"Acte I accompli !"}</p>
 <h3>⭐ Objectifs secondaires (${nbDefis()}/${DEFIS.length})</h3>${DEFIS.map(d=>{const ok=E.defis&&E.defis[d.id],n=Math.min(d.n(),d.max);return `<div class="defi ${ok?"ok":""}">${ok?"✅":"⬜"} ${d.t} <small>(${n}/${d.max}) → ${d.r}</small><div class="jauge petitej"><i style="width:${Math.round(100*n/d.max)}%"></i></div></div>`}).join("")}
 <p class="texte">🎓 Erreurs transformées en leçons : <b>${E.lecons|0}</b></p><button class="petit" id="r">← Retour</button></div>`);
 document.getElementById("r").onclick=back}
const etapeScene=()=>ETAPES.find(x=>x.scene===sceneActive&&!E.etapes[x.id])||null;
function indicePNJ(e){if(presPNJ)return;presPNJ=true;toast(`📍 Clique sur le personnage ▼ (ou touche Entrée) pour : <b>${e.obj}</b>`,3.5)}
function sceneCarte(){
 RETOUR=sceneCarte;enCours=false;verifierDefis();
 const nxt=courante();if(!sceneActive){if(!nxt)return ecranFin();sceneActive=nxt.scene}
 if(!E.vu[sceneActive]){E.vu[sceneActive]=1;sauver()}
 const e=etapeScene();
 if(!e||!proche(e))presPNJ=false;
 const piste=new Set();if(e&&E.objets.includes("Boussole-Rose")){let px=hero.x,py=hero.y,g=0;while(Math.abs(px-e.x)+Math.abs(py-e.y)>1&&g++<20){if(px<e.x)px++;else if(px>e.x)px--;else if(py<e.y)py++;else py--;piste.add(px+","+py)}}
 const dc=DECORS[sceneActive],liste=ETAPES.filter(x=>x.scene===sceneActive),fait=liste.filter(x=>E.etapes[x.id]).length,gris=(1-fait/liste.length).toFixed(2);
 const voy=CHAPITRES().map(c=>`<button class="petit ${c===sceneActive?"sel":""}" data-scene="${c}" ${E.vu[c]?"":"disabled"}>${E.vu[c]?"":"🔒 "}${DECORS[c].nom}</button>`).join(" ");
 let h=`${hud()}<div class="carte" style="margin-bottom:10px">🧭 Voyage : ${voy}<br><b>${dc.nom}</b> — 🎯 <b>${e?e.obj:(nxt?"Prochaine épreuve (autre scène) : "+nxt.obj:"Toutes les épreuves d'ici sont accomplies — fouillez les trésors !")}</b><div class="jauge petitej"><i style="width:${Math.round(100*nbFait()/ETAPES.length)}%"></i></div>🚩 Quête de Bruxelles : ${nbFait()}/${ETAPES.length} · ⭐ Défis ${nbDefis()}/${DEFIS.length}<br> <small>(clique ou flèches · marche sur les ✨ trésors et les décors qui brillent · clique sur le personnage ▼ pour lui parler)</small></div>${horizon(sceneActive)}<div class="plateau" id="plateau" style="--c1:${dc.c1};--c2:${dc.c2};--tex:${TEX[sceneActive]}">`;
 for(let y=0;y<LIG;y++)for(let x=0;x<COL;x++){
  const isP=!!(e&&e.x===x&&e.y===y),d=dc.d.find(a=>a[0]===x&&a[1]===y),it=dc.items.find(a=>a[0]===x&&a[1]===y);let c="";
  if(hero.x===x&&hero.y===y)c=figurine(E.actif);else if(isP)c=`<div class="pion">${SVG[e.pnj]}</div>`;else if(it&&!E.collecte[cle(sceneActive,it)])c=`<span class="item">${ICO[it[2]]}</span>`;else if(d)c=`<span class="deco ${E.collecte["fait:"+d[2]]?"":"neuf"}">${ICO[d[2]]}</span>`;
  h+=`<div class="case ${isP?"pnj":""} ${piste.has(x+","+y)?"dest":""}" data-x="${x}" data-y="${y}"><i class="sol" style="filter:grayscale(${gris})"></i>${c}</div>`}
 ecran(h+`</div><div class="pagination"><button class="petit" id="accueil">⌂ Accueil</button></div>`);
 document.querySelectorAll(".case").forEach(c=>c.onclick=()=>{
  const x=+c.dataset.x,y=+c.dataset.y;
  if(e&&x===e.x&&y===e.y)return proche(e)?declencher(e):aller(x,y,true);
  aller(x,y)});
 document.querySelectorAll("[data-scene]").forEach(b=>b.onclick=()=>{if(b.disabled||b.dataset.scene===sceneActive)return;sceneActive=b.dataset.scene;hero={x:0,y:4};presPNJ=false;sauver();sceneCarte()});
 document.getElementById("accueil").onclick=accueil;
}
function aller(tx,ty,parler){
 if(verrou||enCours)return;verrou=true;const e=etapeScene();
 const pas=setInterval(()=>{
  if(hero.x<tx)hero.x++;else if(hero.x>tx)hero.x--;else if(hero.y<ty)hero.y++;else if(hero.y>ty)hero.y--;
  ramasser();sansFondu=true;sceneCarte();
  if(e&&proche(e))indicePNJ(e);else presPNJ=false;
  if((hero.x===tx&&hero.y===ty)||(parler&&e&&proche(e))){clearInterval(pas);verrou=false;if(parler&&e&&proche(e))declencher(e)}
 },140);
}
document.addEventListener("keydown",ev=>{
 if(!document.getElementById("plateau")||verrou||enCours)return;
 const e=etapeScene();
 if((ev.key==="Enter"||ev.key===" ")&&e&&proche(e)){ev.preventDefault();return declencher(e)}
 const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[ev.key];
 if(!d)return;ev.preventDefault();
 hero.x=Math.max(0,Math.min(COL-1,hero.x+d[0]));hero.y=Math.max(0,Math.min(LIG-1,hero.y+d[1]));
 ramasser();if(e&&proche(e))indicePNJ(e);else presPNJ=false;
 sansFondu=true;sceneCarte();
});
function declencher(e){
 if(enCours)return;enCours=true;
 if(!trial(e.id)){ecran(`${hud(1)}<div class="carte"><h2>Banque incomplète</h2><p class="texte">⚠️ Cette épreuve n'est pas dans la banque chargée. Place questions-acte1.js à côté de index.html.</p><button id="ok">Retour à la carte</button></div>`);document.getElementById("ok").onclick=sceneCarte;return}
 dialogue(e.dial,()=>{
  if(e.type==="duel"||e.id==="T03")lancerDuel(e.id,m=>terminer(e,m));
  else if(e.id==="T07")lancerConcours(e.id,(b,n)=>terminer(e,b===n?"or":b>=n/2?"argent":"bronze",5*b));
  else lancerEpreuve(e.id,m=>terminer(e,m));
 });
}
function terminer(e,m,gain){
 E.etapes[e.id]=m;gain=gain==null?e.or:gain;E.or+=gain;if(m==="or")E.sagesse++;if(e.id==="T12")E.sagesse+=3;if(e.objet&&!E.objets.includes(e.objet))E.objets.push(e.objet);
 ["badr","othman"].forEach(j=>gagnerXP(j,10));sauver();SON.victoire();
 ecran(`${hud(1)}<div class="carte"><h2>${e.fin}</h2><div class="jauge"><i style="width:${Math.round(100*nbFait()/ETAPES.length)}%"></i></div><p class="texte">🏁 Quête de Bruxelles : ${nbFait()}/${ETAPES.length}${courante()?` — 🎯 prochain objectif : ${courante().obj}`:""}</p><div class="medaille">${{or:"🥇 Or",argent:"🥈 Argent",bronze:"🥉 Bronze"}[m]}</div>
 <p class="texte">🎁 +${gain} pièces d'or${e.objet?` · <span class="ico">${ICO[OBJ[e.objet].ic]}</span> <b>${e.objet}</b> — ${OBJ[e.objet].u}`:""} · ✨ +10 XP chacun${m==="or"?" · 💎 +1":""}${e.id==="T12"?" · 💎 +3":""}</p><button id="ok">${e.id==="T12"?"Au coin du feu…":"Continuer"}</button></div>`);
 document.getElementById("ok").onclick=e.id==="T12"?conseil:sceneCarte;
}
function conseil(){
 RETOUR=conseil;
 ecran(`<div class="carte tourcarte"><div class="braise">${SVG.feu}</div><h2>Le Conseil du Feu de Camp</h2><p class="texte">Ce que nous avons appris :</p>${BANQUE.trials.map(t=>`<div class="entree">${{or:"🥇",argent:"🥈",bronze:"🥉"}[E.etapes[t.id]]||"•"} ${t.notion}</div>`).join("")}<button id="ok">Continuer</button></div>`);
 document.getElementById("ok").onclick=()=>dialogue(CLIFF,ecranFin);
}
function statsJ(j){const g=E.joueurs[j].grimoire,ok=g.filter(x=>x.ok).length,nv=niveau(j);
 return `<div class="entree"><b>${JOUEURS[j].titre}</b><br>⭐ Niv. ${nv.n} · ${nv.titre} · ✨ ${E.joueurs[j].xp} XP<br>📖 ${g.length} questions · ✅ ${ok} justes (${g.length?Math.round(100*ok/g.length):0} %) · 🔁 ${revoir(j).length} à revoir</div>`}
function ecranFin(){
 RETOUR=ecranFin;SON.victoire();const nb=m=>Object.values(E.etapes).filter(x=>x===m).length;
 ecran(`<div class="carte tourcarte"><h1>🏁 Acte I accompli !</h1><p class="texte"><b>Objectif atteint :</b> vous voici aux portes de Bruxelles, première Page-Pays à restaurer. L'Atlas est encore déchiré… <i>à suivre dans l'Acte II.</i></p><p class="texte">⭐ Objectifs secondaires : ${nbDefis()}/${DEFIS.length} · 🎓 ${E.lecons|0} erreurs transformées en leçons</p><div class="entree">${DEFIS.map(d=>`${E.defis&&E.defis[d.id]?"✅":"⬜"} ${d.t}`).join("<br>")}</div>
 <div class="medaille">🥇 ${nb("or")} · 🥈 ${nb("argent")} · 🥉 ${nb("bronze")}</div><p class="texte">🪙 ${E.or} pièces · 🧭 ${E.objets.join(", ")||"—"}</p>${statsJ("badr")}${statsJ("othman")}
 <p><button id="gr">📖 Grimoires</button> <button class="petit" id="ac">⌂ Accueil</button></p></div>`);
 document.getElementById("gr").onclick=()=>ouvrirGrimoire();document.getElementById("ac").onclick=accueil;
}

/* ============================ ACCUEIL ============================ */
const txtChrono=()=>"⏱️ Chronomètre du concours : "+(E.opt.chrono===false?"désactivé":"activé");
function accueil(){
 RETOUR=accueil;
 ecran(`<div class="affiche"><div class="m">${SVG.nimrod}</div><div class="m lune"><svg viewBox="0 0 64 64"><path d="M40 8a24 24 0 1 0 0 48a19 19 0 1 1 0-48z" fill="#f0d27a" stroke="#c9962b" stroke-width="2"/></svg></div><div class="m">${SVG.selene}</div></div><div class="titre"><h1>Les Chroniques d'Al-Qamar</h1><p>La Conquête du Monde — Acte I : L'Atlas Déchiré</p></div>
 <div class="carte"><div class="menu">
 <button id="quete">⚔️ Mode Quête ${Object.keys(E.etapes).length?"(continuer)":""}</button>
 <button disabled>🏕️ Entraînement libre (itération 5)</button>
 <button disabled>🛡️ Versus 1 contre 1 (itération 5)</button>
 <button id="gr">📖 Grimoires</button>
 <button id="cs">🔑 Code de sauvegarde</button>
 <button id="chr" class="petit">${txtChrono()}</button>
 <button id="nouvelle" class="petit">🗑️ Nouvelle partie</button></div>
 ${BANQUE.trials.length<12?`<div class="retour ko">⚠️ Banque complète non chargée — ${BANQUE.trials.length} épreuve sur 12. Place questions-acte1.js à côté de index.html.</div>`:`<p class="texte">Banque chargée : 12 épreuves.</p>`}</div>`);
 document.getElementById("quete").onclick=()=>{hero={x:0,y:4};sceneActive=null;E.intro?sceneCarte():introQuete()};
 document.getElementById("gr").onclick=()=>ouvrirGrimoire();document.getElementById("cs").onclick=ecranSauvegarde;document.getElementById("chr").onclick=ev=>{E.opt.chrono=E.opt.chrono===false;sauver();ev.target.textContent=txtChrono()};
 document.getElementById("nouvelle").onclick=()=>{if(confirm("Effacer toute la progression et recommencer ?")){E=neuf();sauver();accueil()}};
}
accueil();
</script>
</body>
