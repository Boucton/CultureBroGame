<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al-Qamar V2 — Le Pokédex de Culture Générale</title>
<style>
:root{--or:#c9962b;--or2:#f0d27a;--mer:#1b2f6b;--mer2:#2c4a9e;--grenat:#8c1d2f;--parch:#f3e6c4;--parch2:#e6d3a3;--encre:#2a1d10}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#2c4a9e,#101b44 70%) fixed;color:var(--encre);font-family:"Trebuchet MS",Verdana,sans-serif;font-size:20px}
#app{max-width:920px;margin:0 auto;padding:14px;position:relative;z-index:1}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:.2em 0}
.titre{text-align:center;color:var(--or2);text-shadow:0 3px 0 #000a}
.titre h1{font-size:2em}
.titre p{font-size:1em;margin:0 0 10px}
.carte{position:relative;background:var(--parch);border:5px double var(--or);border-radius:10px;padding:18px;box-shadow:0 6px 18px #0008;margin:12px 0}
.carte::before,.carte::after{content:"✦";position:absolute;color:var(--or);font-size:22px;line-height:1;text-shadow:0 1px 0 #0006}
.carte::before{top:-3px;left:5px}
.carte::after{bottom:-3px;right:5px}
button{font:inherit;font-size:1em;padding:12px 16px;border-radius:8px;border:3px solid var(--or);background:var(--mer2);color:#fff;cursor:pointer;text-align:left}
button:hover:not(:disabled){background:var(--grenat)}
button:focus-visible{outline:4px solid var(--or2)}
button:disabled{opacity:.55;cursor:not-allowed}
.petit{font-size:.8em;padding:7px 12px}
.menu{display:grid;gap:12px;margin:14px 0}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.disco{position:relative;background:#fff8e6;border:3px solid var(--mer2);border-radius:10px;padding:12px;cursor:pointer;min-height:120px}
.disco:hover{border-color:var(--or);background:#fff6cf}
.disco .ico{font-size:2em}
.disco h3{margin:.1em 0 .2em;font-size:1em;color:var(--grenat)}
.disco .rang{font-size:.8em;opacity:.85}
.nivbar{background:#0003;border:2px solid var(--or);border-radius:12px;height:12px;overflow:hidden;margin-top:6px}
.nivbar i{display:block;height:100%;background:linear-gradient(90deg,var(--grenat),var(--or),var(--or2))}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;color:#fff;margin-bottom:10px}
.hud .joueur{background:#0006;padding:6px 12px;border-radius:20px;border:2px solid var(--or)}
.hud .joueur.actif{background:var(--or);color:var(--encre);font-weight:bold}
.hud .or{background:#0006;padding:6px 12px;border-radius:20px;border:2px solid var(--or2)}
.choix{display:grid;gap:10px;margin:14px 0}
.choix button{background:#fff8e6;color:var(--encre);border-color:var(--mer2)}
.choix button:hover:not(:disabled){background:var(--or2)}
.choix button.bon{background:#2e7d32;color:#fff}
.choix button.mauvais{background:#d98a1f;color:#2a1d10}
.choix button b{display:inline-block;width:1.7em;height:1.7em;line-height:1.7em;text-align:center;border-radius:50%;background:var(--or);color:var(--encre);margin-right:10px}
.retour{border-left:6px solid var(--or);padding:8px 12px;margin:10px 0;background:#fff7;border-radius:4px;line-height:1.45}
.retour.ok{border-color:#2e7d32}
.retour.ko{border-color:#d98a1f}
.arene{display:flex;justify-content:space-around;align-items:center;gap:8px;text-align:center;flex-wrap:wrap}
.camp{flex:1;min-width:140px}
.vs{font:bold 1.6em Georgia,serif;color:var(--grenat)}
.sprite{font-size:3em;line-height:1}
.jauge{background:#0004;border:3px solid var(--or);border-radius:20px;height:22px;overflow:hidden;margin:6px 0}
.jauge i{display:block;height:100%;background:linear-gradient(90deg,var(--grenat),#d98a1f)}
.jauge.xp{height:12px;border-width:2px;margin:3px 0 0}
.jauge.xp i{background:linear-gradient(90deg,var(--mer2),var(--or2))}
.braise{width:80px;margin:0 auto;font-size:2.6em}
@media(prefers-reduced-motion:no-preference){.braise{animation:vacille 1.2s infinite alternate}}
@keyframes vacille{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.08) rotate(2deg)}}
.palan{display:inline-block;background:var(--grenat);color:#fff;border-radius:20px;padding:4px 12px;font-size:.85em;margin:2px 4px 2px 0;border:2px solid var(--or2)}
.entree{background:#fff8;border-radius:6px;padding:8px 12px;margin:8px 0;font-size:.9em;line-height:1.45}
.entree.ok{border-left:6px solid #2e7d32}
.entree.ko{border-left:6px solid #d98a1f}
.revoir{background:var(--grenat);color:#fff;border-radius:12px;padding:1px 8px;font-size:.75em}
textarea{width:100%;height:90px;font:14px monospace;border:3px solid var(--or);border-radius:6px;padding:6px}
.onglets{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.onglets button.sel{background:var(--or);color:var(--encre)}
.tour{background:var(--or);color:var(--encre);padding:8px 16px;border-radius:30px;font-weight:bold;border:3px solid var(--or2);margin:8px auto;display:block}
.tour.othman{background:var(--grenat);color:#fff}
.medaille{font-size:2em;text-align:center}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--parch);border:3px solid var(--or);border-radius:30px;padding:8px 18px;z-index:100;box-shadow:0 4px 12px #0008;max-width:90%;text-align:center;animation:toast 2.4s forwards}
@keyframes toast{0%{opacity:0;top:90px}10%,85%{opacity:1;top:70px}100%{opacity:0}}
@media(max-width:600px){html,body{font-size:17px}}
@media(prefers-reduced-motion:no-preference){#app>*{animation:fondu .35s}}
@keyframes fondu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* V2 — LE POKÉDEX DE CULTURE GÉNÉRALE
   Chaque discipline est un « royaume » à conquérir niveau par niveau,
   comme un Pokémon de culture générale : 10 disciplines × 10 niveaux. */

/* ======== SECTION DONNÉES ======== */
/* La banque V2 : 10 disciplines « royaumes » × 10 questions = 100 questions.
   Chaque question a une version othman (8 ans, primaire) et une version badr (12 ans, collège).
   L'ordre des questions dans une discipline correspond à la difficulté croissante (niveau 1 à 10). */
const BANQUE={disciplines:[
{id:"geo",nom:"Géographie",ico:"🗺️",questions:[
{id:"GEO-01",othman:{enonce:"Sur une carte du monde, combien y a-t-il de grands continents ?",choix:["3","7","10"],reponse:1,explication:"Il y a 7 continents : Afrique, Amérique du Nord, Amérique du Sud, Antarctique, Asie, Europe et Océanie."},badr:{enonce:"Quel est le plus grand océan du monde ?",choix:["L'océan Atlantique","L'océan Pacifique","L'océan Indien"],reponse:1,explication:"L'océan Pacifique est le plus grand : il couvre à lui seul environ un tiers de la surface de la Terre."}},
{id:"GEO-02",othman:{enonce:"Quelle est la capitale de la France ?",choix:["Lyon","Paris","Marseille"],reponse:1,explication:"Paris est la capitale de la France. C'est là que se trouve la tour Eiffel."},badr:{enonce:"Quelle est la capitale du Japon ?",choix:["Kyoto","Tokyo","Osaka"],reponse:1,explication:"Tokyo est la capitale du Japon ; Kyoto était l'ancienne capitale impériale."}},
{id:"GEO-03",othman:{enonce:"Quel est le plus long fleuve de France ?",choix:["La Seine","La Loire","Le Rhône"],reponse:1,explication:"La Loire est le plus long fleuve de France : environ 1 000 km."},badr:{enonce:"Quel fleuve traverse la ville du Caire, en Égypte ?",choix:["Le Nil","L'Amazone","Le Danube"],reponse:0,explication:"Le Nil traverse Le Caire. C'est l'un des plus longs fleuves du monde (environ 6 650 km)."}},
{id:"GEO-04",othman:{enonce:"Le Sahara, le grand désert de sable, se trouve sur quel continent ?",choix:["L'Amérique du Nord","L'Afrique","L'Europe"],reponse:1,explication:"Le Sahara se trouve en Afrique : c'est le plus grand désert chaud du monde."},badr:{enonce:"Quelle chaîne de montagnes sépare la France de l'Espagne ?",choix:["Les Alpes","Les Pyrénées","Le Jura"],reponse:1,explication:"Les Pyrénées forment la frontière naturelle entre la France et l'Espagne."}},
{id:"GEO-05",othman:{enonce:"Quelle est la montagne la plus haute du monde ?",choix:["Le mont Blanc","L'Everest","Le Kilimandjaro"],reponse:1,explication:"L'Everest, dans l'Himalaya, est la plus haute montagne du monde."},badr:{enonce:"Quelle est environ la hauteur de l'Everest ?",choix:["4 810 m","8 849 m","12 000 m"],reponse:1,explication:"L'Everest culmine à environ 8 849 mètres. Le mont Blanc, lui, mesure environ 4 810 m."}},
{id:"GEO-06",othman:{enonce:"Quel est le plus grand continent ?",choix:["L'Afrique","L'Asie","L'Europe"],reponse:1,explication:"L'Asie est le plus grand continent, et aussi le plus peuplé."},badr:{enonce:"Quel pays a la plus grande superficie au monde ?",choix:["La Chine","La Russie","Le Canada"],reponse:1,explication:"La Russie est le plus grand pays du monde ; le Canada est deuxième, la Chine troisième."}},
{id:"GEO-07",othman:{enonce:"Quelle mer se trouve au sud de la France ?",choix:["La Manche","La Méditerranée","La mer du Nord"],reponse:1,explication:"La Méditerranée baigne le sud de la France ; la Manche est au nord."},badr:{enonce:"Quel détroit sépare l'Europe de l'Afrique ?",choix:["Le détroit de Gibraltar","Le Bosphore","Le détroit de Béring"],reponse:0,explication:"Le détroit de Gibraltar, entre l'Espagne et le Maroc, sépare l'Europe de l'Afrique."}},
{id:"GEO-08",othman:{enonce:"Quelle direction est à l'opposé du Nord ?",choix:["L'Est","Le Sud","L'Ouest"],reponse:1,explication:"Sur une rose des vents : le Nord en haut, le Sud en bas, l'Est à droite, l'Ouest à gauche."},badr:{enonce:"Quelle ligne imaginaire coupe la Terre en deux hémisphères ?",choix:["L'équateur","Le méridien de Greenwich","Le tropique du Cancer"],reponse:0,explication:"L'équateur sépare l'hémisphère Nord et l'hémisphère Sud ; Greenwich sépare Est et Ouest."}},
{id:"GEO-09",othman:{enonce:"Sur quel continent se trouve l'Égypte et ses pyramides ?",choix:["L'Afrique","L'Asie","L'Europe"],reponse:0,explication:"L'Égypte se trouve en Afrique, au bord du Nil, avec ses célèbres pyramides."},badr:{enonce:"Quelle est la capitale de l'Australie ?",choix:["Sydney","Canberra","Melbourne"],reponse:1,explication:"Canberra est la capitale de l'Australie, même si Sydney est la ville la plus connue."}},
{id:"GEO-10",othman:{enonce:"Dans quelle ville se trouve la tour Eiffel ?",choix:["Lyon","Paris","Nice"],reponse:1,explication:"La tour Eiffel est à Paris ; elle a été construite en 1889."},badr:{enonce:"Quel est le plus grand pays d'Amérique du Sud ?",choix:["L'Argentine","Le Brésil","Le Pérou"],reponse:1,explication:"Le Brésil est le plus grand pays d'Amérique du Sud et le plus peuplé du continent."}}
]},
{id:"hist",nom:"Histoire",ico:"🏺",questions:[
{id:"HIS-01",othman:{enonce:"Les grandes pyramides se trouvent en...",choix:["Égypte","France","Chine"],reponse:0,explication:"Les pyramides de Gizeh sont en Égypte, construites il y a plus de 4 500 ans."},badr:{enonce:"Comment appelle-t-on les rois de l'Égypte ancienne ?",choix:["Les pharaons","Les césars","Les sultans"],reponse:0,explication:"Les rois d'Égypte ancienne étaient appelés pharaons, comme Toutankhamon ou Ramsès II."}},
{id:"HIS-02",othman:{enonce:"Au Moyen Âge, les chevaliers vivaient dans...",choix:["Des châteaux forts","Des gratte-ciel","Des igloos"],reponse:0,explication:"Au Moyen Âge, les seigneurs et chevaliers vivaient dans des châteaux forts en pierre."},badr:{enonce:"Comment appelle-t-on le guerrier noble du Japon ancien ?",choix:["Le samouraï","Le viking","Le légionnaire"],reponse:0,explication:"Le samouraï était un guerrier japonais, au service d'un seigneur ; il suivait le code de l'honneur du bushido."}},
{id:"HIS-03",othman:{enonce:"Qui a été le premier homme à marcher sur la Lune ?",choix:["Neil Armstrong","Louis Pasteur","Christophe Colomb"],reponse:0,explication:"Neil Armstrong a posé le pied sur la Lune en 1969, lors de la mission Apollo 11."},badr:{enonce:"En quelle année l'homme a-t-il marché sur la Lune pour la première fois ?",choix:["1945","1969","1989"],reponse:1,explication:"Le 21 juillet 1969, Neil Armstrong puis Buzz Aldrin ont marché sur la Lune."}},
{id:"HIS-04",othman:{enonce:"Quelle invention a permis de fabriquer beaucoup de livres ?",choix:["Le téléphone","L'imprimerie","La télévision"],reponse:1,explication:"L'imprimerie a permis de reproduire les livres rapidement, au lieu de les copier à la main."},badr:{enonce:"Qui a inventé l'imprimerie en Europe vers 1440 ?",choix:["Gutenberg","Léonard de Vinci","Newton"],reponse:0,explication:"Johannes Gutenberg a inventé l'imprimerie à caractères mobiles vers 1440, en Allemagne."}},
{id:"HIS-05",othman:{enonce:"Les Romains ont construit un grand monument en pierre à Rome : le...",choix:["Colisée","Louvre","Taj Mahal"],reponse:0,explication:"Le Colisée est un immense amphithéâtre construit par les Romains il y a près de 2 000 ans."},badr:{enonce:"Quel peuple a construit le Colisée ?",choix:["Les Romains","Les Grecs","Les Égyptiens"],reponse:0,explication:"Le Colisée a été construit à Rome sous l'Empire romain, vers 80 après J.-C."}},
{id:"HIS-06",othman:{enonce:"La Révolution française a eu lieu en...",choix:["1789","1889","1589"],reponse:0,explication:"En 1789, le peuple de France s'est révolté : c'est le début de la Révolution française."},badr:{enonce:"Quel roi a été renversé par la Révolution française ?",choix:["Louis XVI","Napoléon","Charlemagne"],reponse:0,explication:"Louis XVI était roi de France en 1789 ; la monarchie a été abolie en 1792."}},
{id:"HIS-07",othman:{enonce:"Napoléon Bonaparte est devenu...",choix:["Un empereur de France","Un pharaon","Un astronaute"],reponse:0,explication:"Napoléon a été empereur des Français au début du XIXe siècle."},badr:{enonce:"Dans quelle bataille Napoléon a-t-il été définitivement vaincu en 1815 ?",choix:["Waterloo","Austerlitz","Hastings"],reponse:0,explication:"La bataille de Waterloo, en Belgique, a marqué la fin de l'Empire de Napoléon en 1815."}},
{id:"HIS-08",othman:{enonce:"Les anciens Égyptiens écrivaient avec des dessins appelés...",choix:["Les hiéroglyphes","Les emojis","Les alphabet"],reponse:0,explication:"Les Égyptiens écrivaient avec des signes-dessins : les hiéroglyphes."},badr:{enonce:"Comment s'appelle la plus ancienne écriture de Mésopotamie ?",choix:["Le cunéiforme","Le latin","Le morse"],reponse:0,explication:"Le cunéiforme, écrit avec des triangles en forme de clous sur des tablettes d'argile, est la plus ancienne écriture connue."}},
{id:"HIS-09",othman:{enonce:"Christophe Colomb a traversé l'océan et a découvert...",choix:["L'Amérique","La Lune","L'Australie"],reponse:0,explication:"En 1492, Christophe Colomb a traversé l'Atlantique et a atteint l'Amérique."},badr:{enonce:"En quelle année Christophe Colomb a-t-il atteint l'Amérique ?",choix:["1492","1789","1912"],reponse:0,explication:"Christophe Colomb a atteint l'Amérique en 1492, croyant arriver aux Indes."}},
{id:"HIS-10",othman:{enonce:"La Seconde Guerre mondiale s'est terminée en...",choix:["1945","1918","2000"],reponse:0,explication:"La Seconde Guerre mondiale s'est terminée en 1945."},badr:{enonce:"Quel pays a envoyé le premier homme dans l'espace, en 1961 ?",choix:["L'URSS","Les États-Unis","La France"],reponse:0,explication:"L'URSS a envoyé Youri Gagarine dans l'espace le 12 avril 1961."}}
]},
{id:"sci",nom:"Sciences et nature",ico:"🔬",questions:[
{id:"SCI-01",othman:{enonce:"De quoi les plantes ont-elles besoin pour pousser ?",choix:["L'eau et la lumière du soleil","Des bonbons","Du chocolat"],reponse:0,explication:"Les plantes ont besoin d'eau, de lumière et de terre pour pousser."},badr:{enonce:"Comment s'appelle la transformation de l'eau en vapeur ?",choix:["La condensation","L'évaporation","La solidification"],reponse:1,explication:"Quand l'eau chauffe, elle s'évapore et devient de la vapeur ; en refroidissant, elle se condense en gouttelettes."}},
{id:"SCI-02",othman:{enonce:"L'eau devient de la glace quand il fait...",choix:["très froid","très chaud","très chaud et froid"],reponse:0,explication:"Quand il fait très froid, en dessous de 0 degré, l'eau gèle et devient de la glace."},badr:{enonce:"À quelle température l'eau gèle-t-elle (pression normale) ?",choix:["0 °C","10 °C","−10 °C"],reponse:0,explication:"L'eau gèle à 0 degré Celsius ; c'est pourquoi la glace se forme en hiver."}},
{id:"SCI-03",othman:{enonce:"Le soleil nous donne...",choix:["De la lumière et de la chaleur","De la pluie","Du vent"],reponse:0,explication:"Le Soleil nous éclaire et nous réchauffe : c'est l'énergie du Soleil qui fait vivre la Terre."},badr:{enonce:"Parmi ces sources d'énergie, laquelle est renouvelable ?",choix:["Le vent","Le charbon","Le pétrole"],reponse:0,explication:"Le vent (énergie éolienne) est renouvelable ; le charbon et le pétrole sont des énergies fossiles, épuisables."}},
{id:"SCI-04",othman:{enonce:"Combien de pattes a une araignée ?",choix:["8","6","4"],reponse:0,explication:"Une araignée a 8 pattes ; les insectes, eux, en ont 6."},badr:{enonce:"Comment appelle-t-on le scientifique qui étudie les insectes ?",choix:["Un entomologiste","Un astronome","Un géologue"],reponse:0,explication:"L'entomologiste étudie les insectes ; l'astronome observe le ciel, le géologue les roches."}},
{id:"SCI-05",othman:{enonce:"La chenille se transforme en...",choix:["Un papillon","Une abeille","Un oiseau"],reponse:0,explication:"La chenille se transforme en papillon : c'est une vraie métamorphose !"},badr:{enonce:"Comment s'appelle la transformation de la chenille en papillon ?",choix:["La métamorphose","La photosynthèse","La migration"],reponse:0,explication:"La métamorphose est le passage de la chenille (larve) à la chrysalide puis au papillon."}},
{id:"SCI-06",othman:{enonce:"Un arc-en-ciel apparaît quand il y a...",choix:["De la pluie et du soleil","De la neige et du vent","Des nuages noirs"],reponse:0,explication:"L'arc-en-ciel apparaît quand la lumière du soleil traverse les gouttes de pluie."},badr:{enonce:"Quelles couleurs se trouvent aux deux extrémités d'un arc-en-ciel ?",choix:["Rouge et violet","Bleu et vert","Jaune et orange"],reponse:0,explication:"L'arc-en-ciel va du rouge (extérieur) au violet (intérieur) : rouge, orange, jaune, vert, bleu, indigo, violet."}},
{id:"SCI-07",othman:{enonce:"Quel objet sert à mesurer la température ?",choix:["Le thermomètre","La règle","Le compas"],reponse:0,explication:"Le thermomètre mesure la température : il nous dit s'il fait chaud ou froid."},badr:{enonce:"Quel instrument mesure la force du vent ?",choix:["L'anémomètre","Le baromètre","Le chronomètre"],reponse:0,explication:"L'anémomètre mesure la vitesse du vent ; le baromètre mesure la pression de l'air."}},
{id:"SCI-08",othman:{enonce:"Un aimant attire...",choix:["Le fer","Le bois","Le plastique"],reponse:0,explication:"Un aimant attire les objets en fer, comme les clous ou les trombones."},badr:{enonce:"Comment s'appellent les deux extrémités d'un aimant ?",choix:["Le pôle nord et le pôle sud","Le plus et le moins","Le haut et le bas"],reponse:0,explication:"Un aimant a un pôle nord et un pôle sud : deux pôles opposés s'attirent, deux pôles identiques se repoussent."}},
{id:"SCI-09",othman:{enonce:"Au soleil, les flaques d'eau sur la route...",choix:["Disparaissent en s'évaporant","Deviennent des pierres","Se transforment en sable"],reponse:0,explication:"Le soleil chauffe l'eau des flaques, qui s'évapore dans l'air : c'est pour ça qu'elles disparaissent."},badr:{enonce:"Comment s'appelle le retour de la vapeur d'eau à l'état liquide ?",choix:["La condensation","L'évaporation","La fusion"],reponse:0,explication:"La condensation transforme la vapeur d'eau en gouttelettes liquides : c'est ainsi que se forment les nuages."}},
{id:"SCI-10",othman:{enonce:"Quel animal pond des œufs ?",choix:["La poule","La vache","Le chat"],reponse:0,explication:"La poule pond des œufs : les oiseaux naissent d'œufs, comme les reptiles et les poissons."},badr:{enonce:"Quel est le seul mammifère capable de vraiment voler ?",choix:["La chauve-souris","L'écureuil volant","Le pingouin"],reponse:0,explication:"La chauve-souris est le seul mammifère qui vole vraiment avec ses ailes membraneuses ; l'écureuil volant ne fait que planer."}}
]}
,{id:"math",nom:"Mathématiques",ico:"📐",questions:[
{id:"MAT-01",othman:{enonce:"Combien font 7 + 8 ?",choix:["14","15","16"],reponse:1,explication:"7 + 8 = 15 : on peut se repérer avec 7 + 7 = 14, puis ajouter 1."},badr:{enonce:"Combien font 12 × 12 ?",choix:["124","144","156"],reponse:1,explication:"12 × 12 = 144 : c'est le célèbre « carré » de 12."}},
{id:"MAT-02",othman:{enonce:"Combien font 20 − 6 ?",choix:["12","14","16"],reponse:1,explication:"20 − 6 = 14 : on enlève 6 à 20, il reste 14."},badr:{enonce:"Combien font 144 ÷ 12 ?",choix:["11","12","14"],reponse:1,explication:"144 ÷ 12 = 12, car 12 × 12 = 144."}},
{id:"MAT-03",othman:{enonce:"Quelle figure a 3 côtés ?",choix:["Le triangle","Le carré","Le cercle"],reponse:0,explication:"Le triangle a 3 côtés et 3 angles ; le carré en a 4."},badr:{enonce:"Comment appelle-t-on un triangle qui a un angle droit ?",choix:["Un triangle isocèle","Un triangle rectangle","Un triangle équilatéral"],reponse:1,explication:"Un triangle rectangle possède un angle droit (90°)."}},
{id:"MAT-04",othman:{enonce:"Combien de minutes y a-t-il dans une heure ?",choix:["30","60","100"],reponse:1,explication:"Une heure dure 60 minutes ; une demi-heure dure 30 minutes."},badr:{enonce:"Combien de secondes y a-t-il dans un quart d'heure ?",choix:["900","1 500","600"],reponse:0,explication:"Un quart d'heure = 15 minutes = 15 × 60 = 900 secondes."}},
{id:"MAT-05",othman:{enonce:"Quel nombre est pair ?",choix:["7","10","13"],reponse:1,explication:"10 est pair : un nombre pair se termine par 0, 2, 4, 6 ou 8."},badr:{enonce:"Quel est le plus petit nombre premier ?",choix:["0","1","2"],reponse:2,explication:"2 est le plus petit nombre premier : divisible uniquement par 1 et par lui-même."}},
{id:"MAT-06",othman:{enonce:"Une pomme coûte 2 pièces d'or. Combien coûtent 3 pommes ?",choix:["5 pièces","6 pièces","8 pièces"],reponse:1,explication:"3 × 2 = 6 : trois pommes coûtent 6 pièces d'or."},badr:{enonce:"Un marchand vend 3 pommes à 2 pièces chacune et rend 4 pièces sur 10. Combien reste-t-il à payer ?",choix:["2 pièces","0 pièce","4 pièces"],reponse:1,explication:"3 × 2 = 6 pièces ; 10 − 6 = 4 pièces rendues... donc tout est payé, il reste 0 pièce."}},
{id:"MAT-07",othman:{enonce:"Combien font 5 × 5 ?",choix:["10","25","55"],reponse:1,explication:"5 × 5 = 25 : c'est le résultat de la table de 5."},badr:{enonce:"Quelle est la racine carrée de 81 ?",choix:["8","9","11"],reponse:1,explication:"9 × 9 = 81, donc la racine carrée de 81 est 9."}},
{id:"MAT-08",othman:{enonce:"Si tu partages 12 bonbons entre 3 amis, chacun reçoit...",choix:["3 bonbons","4 bonbons","6 bonbons"],reponse:1,explication:"12 ÷ 3 = 4 : chaque ami reçoit 4 bonbons."},badr:{enonce:"Quelle est la moitié de 150 ?",choix:["70","75","80"],reponse:1,explication:"150 ÷ 2 = 75, la moitié de 150."}},
{id:"MAT-09",othman:{enonce:"Quel nombre vient juste après 49 ?",choix:["40","50","60"],reponse:1,explication:"Après 49 vient 50 : on passe à la dizaine suivante."},badr:{enonce:"Quel nombre vient juste avant 1 000 ?",choix:["900","999","1 001"],reponse:1,explication:"Juste avant 1 000 vient 999."}},
{id:"MAT-10",othman:{enonce:"La partie la plus longue d'une règle graduée mesure en...",choix:["Centimètres","Litres","Grammes"],reponse:0,explication:"Une règle graduée mesure des longueurs en centimètres ; les litres mesurent des liquides et les grammes des masses."},badr:{enonce:"Quelle unité utilise-t-on pour mesurer un volume de lait ?",choix:["Le litre","Le kilogramme","Le mètre"],reponse:0,explication:"Le litre mesure un volume (le lait d'une brique) ; le kilogramme mesure une masse, le mètre une longueur."}}
]},
{id:"fr",nom:"Français",ico:"📚",questions:[

{id:"FRA-03",othman:{enonce:"Quelle est la majuscule de la lettre b ?",choix:["D","B","P"],reponse:1,explication:"La majuscule de b est B ; on l'utilise en début de phrase et aux noms propres."},badr:{enonce:"Quel mot prend une majuscule ?",choix:["la france","Le Maroc","le lundi"],reponse:1,explication:"Les noms propres (pays, prénoms, villes) prennent une majuscule : le Maroc, la France."}},

{id:"FRA-05",othman:{enonce:"Le contraire de « grand » est...",choix:["petit","gros","haut"],reponse:0,explication:"Le contraire (l'antonyme) de « grand » est « petit »."},badr:{enonce:"Quel est le féminin de « directeur » ?",choix:["directeuse","directrice","directeure"],reponse:1,explication:"Le féminin de « directeur » est « directrice » ; de même : acteur → actrice."}},
{id:"FRA-06",othman:{enonce:"Le pluriel de « un cheval » est...",choix:["des chevals","des chevaux","des cheval"],reponse:1,explication:"Un cheval, des chevaux : certains noms en -al font leur pluriel en -aux."},badr:{enonce:"Quel est le pluriel de « un travail » ?",choix:["des travails","des travaux","des travail"],reponse:1,explication:"Un travail, des travaux : comme cheval → chevaux, le pluriel se forme en -aux."}},
{id:"FRA-07",othman:{enonce:"Qu'est-ce qu'un verbe ?",choix:["Un mot qui décrit une action","Un mot qui décrit une couleur","Le nom d'un pays"],reponse:0,explication:"Le verbe est le mot de l'action : chanter, courir, dormir..."},badr:{enonce:"Dans « Il lit un livre », à quel temps est le verbe « lit » ?",choix:["Le futur","Le présent","L'imparfait"],reponse:1,explication:"« lit » est au présent de l'indicatif : l'action se passe maintenant."}},
{id:"FRA-08",othman:{enonce:"Quelle phrase commence par une majuscule et finit par un point ?",choix:["le chat dort","Le chat dort.","le chat dort."],reponse:1,explication:"Une phrase correcte commence par une majuscule et se termine par un point."},badr:{enonce:"Quel signe de ponctuation marque une exclamation ?",choix:["Le point d'exclamation","Le point virgule","Les deux-points"],reponse:0,explication:"Le point d'exclamation ( ! ) marque la surprise, la joie ou l'ordre."}},
{id:"FRA-09",othman:{enonce:"« Le loup __ dans la forêt » : quel verbe convient ?",choix:["dort","dort le","la dort"],reponse:0,explication:"« Le loup dort dans la forêt » : le verbe « dort » suit le sujet « le loup »."},badr:{enonce:"Quel est le synonyme de « rapide » ?",choix:["lent","vif","fatigué"],reponse:1,explication:"« vif » est un synonyme de « rapide » ; « lent » est son contraire."}},
{id:"FRA-10",othman:{enonce:"Dans une bibliothèque, on emprunte des...",choix:["livres","ballons","vélos"],reponse:0,explication:"À la bibliothèque, on emprunte des livres et on lit des histoires."},badr:{enonce:"Comment appelle-t-on une personne qui écrit des livres ?",choix:["Un écrivain","Un lecteur","Un imprimeur"],reponse:0,explication:"L'écrivain (ou auteur) écrit les livres ; le lecteur les lit, l'imprimeur les fabrique."}}
]}
,{id:"astro",nom:"Astronomie",ico:"🌙",questions:[
{id:"AST-01",othman:{enonce:"La nuit, on voit briller des étoiles et...",choix:["La Lune","Deux soleils","Des nuages rouges"],reponse:0,explication:"La nuit, on voit la Lune et les étoiles ; le Soleil, lui, brille le jour."},badr:{enonce:"Quelle est l'étoile la plus proche de la Terre ?",choix:["La Lune","Le Soleil","L'étoile Polaire"],reponse:1,explication:"Le Soleil est l'étoile la plus proche de la Terre ; la Lune n'est pas une étoile, c'est un satellite."}},
{id:"AST-02",othman:{enonce:"Autour de quel astre tourne la Terre ?",choix:["La Lune","Le Soleil","Mars"],reponse:1,explication:"La Terre tourne autour du Soleil : un tour complet dure un an."},badr:{enonce:"Combien de temps met la Terre pour faire le tour du Soleil ?",choix:["Un jour","Un mois","Un an"],reponse:2,explication:"La Terre fait le tour du Soleil en 365 jours et un quart : c'est une année."}},
{id:"AST-03",othman:{enonce:"Quelle forme a la Lune quand elle est entière ?",choix:["Un croissant","Un cercle plein","Un demi-cercle"],reponse:1,explication:"La pleine Lune est un disque tout rond et brillant."},badr:{enonce:"Pourquoi la Lune change-t-elle de forme (phases) ?",choix:["Parce qu'on la voit sous différents angles éclairés par le Soleil","Parce qu'elle se casse","Parce que des nuages la cachent"],reponse:0,explication:"Les phases de la Lune viennent de l'angle sous lequel on voit sa partie éclairée par le Soleil."}},
{id:"AST-04",othman:{enonce:"Le Soleil se lève...",choix:["le matin","le soir","la nuit"],reponse:0,explication:"Le Soleil se lève le matin à l'Est et se couche le soir à l'Ouest."},badr:{enonce:"Dans quel sens la Terre tourne-t-elle sur elle-même ?",choix:["D'ouest en est","D'est en ouest","Elle ne tourne pas"],reponse:0,explication:"La Terre tourne d'ouest en est : c'est pourquoi le Soleil semble se lever à l'est."}},
{id:"AST-05",othman:{enonce:"Comment s'appelle notre planète ?",choix:["Mars","La Terre","Jupiter"],reponse:1,explication:"Nous vivons sur la planète Terre, la troisième planète du Soleil."},badr:{enonce:"Quelle est la troisième planète à partir du Soleil ?",choix:["Vénus","La Terre","Mars"],reponse:1,explication:"Ordre des planètes : Mercure, Vénus, Terre, Mars, Jupiter, Saturne, Uranus, Neptune."}},
{id:"AST-06",othman:{enonce:"Combien de planètes tournent autour de notre Soleil ?",choix:["3","8","12"],reponse:1,explication:"Il y a 8 planètes autour du Soleil, de Mercure à Neptune."},badr:{enonce:"Quelle est la plus grande planète du système solaire ?",choix:["Jupiter","Saturne","La Terre"],reponse:0,explication:"Jupiter est la plus grande : toutes les autres planètes réunies tiendraient dedans."}},
{id:"AST-07",othman:{enonce:"Quel animal est allé dans l'espace avant l'homme ?",choix:["La chienne Laïka","Le chat Félix","Le pigeon Ramier"],reponse:0,explication:"Laïka, une petite chienne, a été envoyée dans l'espace en 1957, avant les premiers hommes."},badr:{enonce:"Quelle sonde a été la première à quitter le système solaire ?",choix:["Voyager 1","Apollo 11","Hubble"],reponse:0,explication:"Voyager 1, lancée en 1977, est l'objet humain le plus lointain : elle a quitté le système solaire."}},
{id:"AST-08",othman:{enonce:"Que voit-on parfois en regardant le ciel avec un télescope ?",choix:["Des planètes comme Saturne","Des pays","Des océans de la Terre"],reponse:0,explication:"Avec un télescope, on peut voir des planètes comme Saturne et ses anneaux."},badr:{enonce:"Quelle planète est connue pour ses magnifiques anneaux ?",choix:["Mars","Saturne","Mercure"],reponse:1,explication:"Saturne est entourée d'anneaux formés de milliards de morceaux de glace et de roche."}},
{id:"AST-09",othman:{enonce:"Les étoiles brillent la nuit comme des...",choix:["petites lampes très loin","lampes de poche","bougies sur la Terre"],reponse:0,explication:"Les étoiles sont comme des soleils très lointains : elles brillent faiblement car elles sont très loin."},badr:{enonce:"Pourquoi les étoiles scintillent-elles ?",choix:["À cause de l'air qui bouge dans l'atmosphère","Parce qu'elles clignent des yeux","Parce qu'elles s'allument et s'éteignent"],reponse:0,explication:"L'air de l'atmosphère bouge sans arrêt et fait vaciller la lumière des étoiles : elles scintillent."}},
{id:"AST-10",othman:{enonce:"Comment appelle-t-on un scientifique qui observe le ciel ?",choix:["Un astronome","Un boulanger","Un pilote"],reponse:0,explication:"L'astronome observe les étoiles, les planètes et les galaxies."},badr:{enonce:"Comment appelle-t-on la Voie lactée ?",choix:["Notre galaxie","Une comète","Une constellation"],reponse:0,explication:"La Voie lactée est la galaxie où se trouve notre Soleil : vue de l'intérieur, elle ressemble à une bande laiteuse."}}
]},
{id:"corp",nom:"Corps humain et santé",ico:"🫀",questions:[
{id:"COR-01",othman:{enonce:"Quel organe bat dans ta poitrine ?",choix:["Le cœur","Le cerveau","Le foie"],reponse:0,explication:"Le cœur bat sans arrêt pour envoyer le sang dans tout le corps."},badr:{enonce:"Quel organe pompe le sang dans le corps ?",choix:["Le cœur","Les poumons","L'estomac"],reponse:0,explication:"Le cœur est une pompe musclée qui fait circuler le sang environ 100 000 fois par jour."}},
{id:"COR-02",othman:{enonce:"Avec quoi respires-tu ?",choix:["Les poumons","Les oreilles","Les genoux"],reponse:0,explication:"On respire avec les poumons : ils prennent l'air et gardent son oxygène."},badr:{enonce:"Quel gaz notre corps prend-il dans l'air pour vivre ?",choix:["L'oxygène","L'azote","Le gaz carbonique"],reponse:0,explication:"Nous respirons l'oxygène de l'air et nous rejetons du gaz carbonique."}},
{id:"COR-03",othman:{enonce:"Combien as-tu de dents de lait quand tu es petit ?",choix:["20","32","10"],reponse:0,explication:"Un enfant a 20 dents de lait ; un adulte en a 32."},badr:{enonce:"Combien de dents un adulte a-t-il normalement ?",choix:["20","28","32"],reponse:2,explication:"Un adulte a 32 dents en comptant les dents de sagesse."}},
{id:"COR-04",othman:{enonce:"Pour avoir de bons os, il faut boire...",choix:["Du lait","Du soda","Du café"],reponse:0,explication:"Le lait contient du calcium, qui rend les os solides."},badr:{enonce:"Quel minéral rend les os solides ?",choix:["Le calcium","Le fer","Le sel"],reponse:0,explication:"Le calcium (dans le lait, le fromage) solidifie les os ; le fer, lui, sert à faire le sang."}},
{id:"COR-05",othman:{enonce:"Que faut-il faire avant de manger ?",choix:["Se laver les mains","Se laver les pieds","Courir"],reponse:0,explication:"Se laver les mains avant de manger éloigne les microbes."},badr:{enonce:"Comment s'appellent les minuscules êtres vivants qui peuvent nous rendre malades ?",choix:["Les microbes","Les atomes","Les volcans"],reponse:0,explication:"Les microbes (bactéries, virus) sont invisibles à l'œil nu et peuvent rendre malades : d'où le lavage des mains."}},
{id:"COR-06",othman:{enonce:"Combien d'yeux as-tu ?",choix:["1","2","4"],reponse:1,explication:"Nous avons 2 yeux, et grâce aux deux ensemble, nous voyons en relief (en 3D)."},badr:{enonce:"Quel organe commande tout le corps ?",choix:["Le cerveau","Le cœur","L'estomac"],reponse:0,explication:"Le cerveau est le chef : il pense, mémorise et commande les mouvements via les nerfs."}},
{id:"COR-07",othman:{enonce:"Combien de temps doit-on dormir chaque nuit quand on est enfant ?",choix:["Environ 10 heures","2 heures","16 heures"],reponse:0,explication:"Un enfant a besoin d'environ 10 heures de sommeil pour grandir et apprendre."},badr:{enonce:"Que se passe-t-il quand on manque de sommeil ?",choix:["On mémorise moins bien et on est fatigué","On devient plus intelligent","Rien du tout"],reponse:0,explication:"Le sommeil aide le cerveau à classer les souvenirs de la journée : sans sommeil, on apprend moins bien."}},
{id:"COR-08",othman:{enonce:"Le sang coule dans des tuyaux du corps appelés...",choix:["les veines","les routes","les os"],reponse:0,explication:"Le sang circule dans les vaisseaux sanguins : artères et veines."},badr:{enonce:"Comment s'appellent les petits vaisseaux les plus fins du corps ?",choix:["Les capillaires","Les bronches","Les tendons"],reponse:0,explication:"Les capillaires sont si fins qu'une seule goutte de sang s'y file un par un : c'est là que s'échangent oxygène et nutriments."}},
{id:"COR-09",othman:{enonce:"Faire du sport rend le corps...",choix:["fort et en bonne santé","fatigué pour toujours","malade"],reponse:0,explication:"Le sport muscle le corps, fortifie le cœur et rend de bonne humeur."},badr:{enonce:"Que fait le muscle quand il travaille ?",choix:["Il se contracte et se relâche","Il grandit sans arrêt","Il durcit comme de la pierre"],reponse:0,explication:"Un muscle se contracte (se raccourcit) puis se relâche : c'est ce qui produit le mouvement."}},
{id:"COR-10",othman:{enonce:"Quelle partie du corps sent les odeurs ?",choix:["Le nez","La bouche","Les mains"],reponse:0,explication:"Le nez sent les odeurs : c'est l'odorat."},badr:{enonce:"Combien de sens avons-nous ?",choix:["4","5","7"],reponse:1,explication:"Les 5 sens : la vue, l'ouïe, l'odorat, le goût et le toucher."}}
]},
{id:"islam",nom:"Islam et civilisation arabo-musulmane",ico:"🕌",questions:[
{id:"ISL-01",othman:{enonce:"Quel est le livre saint de l'islam ?",choix:["Le Coran","La Biblio","Le dictionnaire"],reponse:0,explication:"Le Coran est le livre saint des musulmans, révélé au prophète Mouhammad."},badr:{enonce:"Dans quelle ville est née l'islam ?",choix:["La Mecque","Le Caire","Bagdad"],reponse:0,explication:"L'islam est né à la Mecque, en Arabie, au VIIe siècle."}},
{id:"ISL-02",othman:{enonce:"Combien y a-t-il de piliers dans l'islam ?",choix:["3","5","7"],reponse:1,explication:"L'islam a 5 piliers : la profession de foi, la prière, l'aumône, le jeûne et le pèlerinage."},badr:{enonce:"Comment appelle-t-on l'aumône obligatoire en islam ?",choix:["La zakat","Le hajj","Le sawm"],reponse:0,explication:"La zakat est l'aumône purificatrice, donnée chaque année aux pauvres."}},
{id:"ISL-03",othman:{enonce:"Quel mois saint les musulmans jeûnent-ils ?",choix:["Le Ramadan","Le janvier","Le lundi"],reponse:0,explication:"Pendant le Ramadan, les musulmans jeûnent du lever au coucher du soleil."},badr:{enonce:"Quel repas rompt le jeûne chaque soir du Ramadan ?",choix:["Le ftour (iftar)","Le sahour du matin","Le dîner du vendredi"],reponse:0,explication:"Le ftour (iftar) est le repas du soir qui rompt le jeûne ; le sahour est pris avant l'aube."}},
{id:"ISL-04",othman:{enonce:"Comment s'appelle le lieu de prière des musulmans ?",choix:["La mosquée","L'église","La synagogue"],reponse:0,explication:"Les musulmans prient à la mosquée ; on y entend aussi l'appel à la prière."},badr:{enonce:"Comment appelle-t-on la tour d'où retentit l'appel à la prière ?",choix:["Le minaret","Le mihrab","Le dôme"],reponse:0,explication:"Le minaret est la tour d'où le muezzin appelle à la prière ; le mihrab indique la direction de la Mecque."}},
{id:"ISL-05",othman:{enonce:"Les chiffres que nous utilisons (1, 2, 3...) viennent des...",choix:["chiffres arabes","chiffres romains","dessins"],reponse:0,explication:"Nos chiffres 1, 2, 3 viennent des chiffres arabes, transmis par les savants de l'islam."},badr:{enonce:"Quelle grande maison de sagesse a été fondée à Bagdad au IXe siècle ?",choix:["La Maison de la sagesse (Bayt al-Hikma)","L'Académie de Platon","La bibliothèque d'Alexandrie"],reponse:0,explication:"Le calife Haroun al-Rachid puis son fils al-Ma'mun ont fondé à Bagdad la Maison de la sagesse, immense centre de traduction et de recherche."}},
{id:"ISL-06",othman:{enonce:"Le conte d'« Aladin » et ses contes viennent du livre...",choix:["Les Mille et Une Nuits","Le Petit Prince","Harry Potter"],reponse:0,explication:"Aladin, Ali Baba et Sindbad sont des contes des Mille et Une Nuits."},badr:{enonce:"Quel grand conte des Mille et Une Nuits parle d'un marin qui voyage par mer ?",choix:["Sindbad le marin","Ali Baba","Aladin"],reponse:0,explication:"Sindbad le marin fait sept voyages extraordinaires ; Ali Baba découvre la caverne des quarante voleurs."}},
{id:"ISL-07",othman:{enonce:"En quelle direction les musulmans prient-ils ?",choix:["Vers la Mecque","Vers le nord","Vers la mer"],reponse:0,explication:"Les musulmans prient en direction de la Kaaba, à la Mecque."},badr:{enonce:"Comment appelle-t-on la direction de la prière ?",choix:["La qibla","La zakat","Le wudu"],reponse:0,explication:"La qibla est la direction de la Kaaba ; le mihrab des mosquées l'indique."}},
{id:"ISL-08",othman:{enonce:"Quel grand savant musulman a écrit des livres de médecine très célèbres ?",choix:["Ibn Sina (Avicenne)","Newton","Einstein"],reponse:0,explication:"Ibn Sina, dit Avicenne, a écrit le Canon de la médecine, utilisé pendant des siècles."},badr:{enonce:"Quel savant andalou a révolutionné la médecine au Xe siècle ?",choix:["Al-Zahrawi","Al-Khwarizmi","Ibn Battuta"],reponse:0,explication:"Al-Zahrawi (Abulcasis), de Cordoue, est le père de la chirurgie moderne ; son livre a servi de référence en Europe pendant 500 ans."}},
{id:"ISL-09",othman:{enonce:"Quel voyageur musulman a parcouru le monde entier il y a 700 ans ?",choix:["Ibn Battuta","Christophe Colomb","Marco Polo"],reponse:0,explication:"Ibn Battuta a voyagé plus de 30 ans, de l'Afrique à la Chine : 120 000 km à pied et à cheval !"},badr:{enonce:"Quel mathématicien a donné son nom à l'« algèbre » ?",choix:["Al-Khwarizmi","Euclide","Pythagore"],reponse:0,explication:"Al-Khwarizmi a écrit le premier livre d'algèbre ; son nom latinisé a aussi donné le mot « algorithme »."}},
{id:"ISL-10",othman:{enonce:"Combien de fois par jour un musulman adulte prie-t-il ?",choix:["5","2","10"],reponse:0,explication:"On prie 5 fois par jour : à l'aube, à midi, l'après-midi, au coucher et la nuit."},badr:{enonce:"Quel est le pèlerinage à la Mecque que tout musulman essaye de faire une fois dans sa vie ?",choix:["Le hajj","Le omra du vendredi","Le zakat annuel"],reponse:0,explication:"Le hajj est le grand pèlerinage à la Mecque, cinquième pilier de l'islam."}}
]}

/* ======== SECTION MOTEUR DE QUESTIONS ======== */
const MOTEUR={
 joueurActif:"othman",
 version(q){return q[this.joueurActif]||q.othman},
 /* Choisit une question : priorité aux notions échouées (révision), sinon la première question non encore réussie de la discipline. */
 choisir(discId){
  const disc=BANQUE.disciplines.find(d=>d.id===discId);
  const st=E.joueurs[this.joueurActif];
  const aRevoir=disc.questions.filter(q=>{const t=st.progression[q.id];return t&&t.echecs>0&&!t.maitrise});
  if(aRevoir.length){const q=aRevoir[Math.floor(Math.random()*aRevoir.length)];return {q,revision:true}}
  const neuve=disc.questions.find(q=>!st.progression[q.id]);
  if(neuve)return {q:neuve,revision:false};
  return {q:disc.questions[Math.floor(Math.random()*disc.questions.length)],revision:false};
 }
};

/* ======== SECTION GRIMOIRE ======== */
/* Non négociable : toute question posée, la réponse du joueur, la bonne réponse et l'explication sont enregistrées dans le Grimoire personnel. */
const GRIMOIRE={
 consigner(joueur,qid,discNom,enonce,reponseJoueur,reponseCorrecte,explication,ok){
  const st=E.joueurs[joueur];
  st.grimoire.unshift({q:qid,disc:discNom,enonce:enonce,repJoueur:reponseJoueur,repCorrecte:reponseCorrecte,explication:explication,ok:ok,date:new Date().toLocaleDateString("fr-FR")});
  if(st.grimoire.length>500)st.grimoire.length=500;
  const p=st.progression[qid]||(st.progression[qid]={reussites:0,echecs:0,maitrise:false});
  if(ok){p.reussites++;if(p.reussites>=2)p.maitrise=true}else{p.echecs++}
 }
};

/* ======== SECTION COMBAT ======== */
/* Combat tour par tour façon Pokémon : le Gardien de la Discipline lance une question ; bonne réponse = ton attaque réussit, mauvaise réponse = l'Encre Noire contre-attaque (jamais la faute de l'enfant). */
const COMBAT={
 etat:null,
 commencer(discId){
  const disc=BANQUE.disciplines.find(d=>d.id===discId);
  const st=E.joueurs[MOTEUR.joueurActif];
  const niv=this.niveau(st,discId);
  this.etat={disc:discId,nom:disc.nom,ico:disc.ico,niv:niv,
   herosPv:100+st.niveau*5,herosPvMax:100+st.niveau*5,
   gardienPv:60+niv*15,gardienPvMax:60+niv*15,tour:"heros",fini:false};
  SCENES.combat();
 },
 niveau(st,discId){
  const disc=BANQUE.disciplines.find(d=>d.id===discId);
  let n=1;
  disc.questions.forEach(q=>{const p=st.progression[q.id];if(p&&p.maitrise)n++});
  return Math.min(n,10);
 },
 /* Exécuté après chaque réponse : ok = attaque réussie, !ok = l'Encre Noire frappe. */
 resoudre(ok){
  const e=this.etat;if(!e||e.fini)return;
  if(ok){e.gardienPv=Math.max(0,e.gardienPv-25+Math.round(Math.random()*10))}
  else{e.herosPv=Math.max(0,e.herosPv-(15+Math.round(Math.random()*8)))}
  if(e.gardienPv<=0){e.fini=true;e.victoire=true}
  else if(e.herosPv<=0){e.fini=true;e.victoire=false}
  SCENES.combat();
 }
};

/* ======== SECTION ÉCONOMIE ======== */
const ECO={
 recompense(ok){
  const st=E.joueurs[MOTEUR.joueurActif];
  if(ok){st.or+=10;st.xp+=2;this.palier(st)}else{st.or+=2}
 },
 palier(st){
  while(st.xp>=st.niveau*3){st.xp-=st.niveau*3;st.niveau++;st.rang=this.rang(st.niveau)}
 },
 rang(n){return n<3?"Écuyer":n<6?"Chevalier":n<10?"Sage":"Légende d'Al-Qamar"},
 boutique:[
  {id:"indice",nom:"Indice du Scribe",ico:"🔍",prix:15,desc:"Le Scribe raye une mauvaise réponse avant l'épreuve."},
  {id:"soin",nom:"Fiole de miel",ico:"🍯",prix:20,desc:"Rend 40 points de vie au héros pendant un combat."},
  {id:"talisman",nom:"Talisman d'endurance",ico:"🧿",prix:35,desc:"+20 points de vie maximum pour le prochain combat."}
 ],
 acheter(item){
  const st=E.joueurs[MOTEUR.joueurActif];
  if(st.or<item.prix)return false;
  st.or-=item.prix;st.sac[item.id]=(st.sac[item.id]||0)+1;SAUVEGARDE.sauver();return true;
 }
};

/* ======== SECTION SAUVEGARDE ======== */
const CLE="alqamar-v2";
const SAUVEGARDE={
 defaut(){return{version:3,joueurActif:"othman",joueurs:{
  othman:{nom:"Othman",niveau:1,xp:0,or:30,rang:"Écuyer",grimoire:[],progression:{},sac:{}},
  badr:{nom:"Badr",niveau:1,xp:0,or:30,rang:"Écuyer",grimoire:[],progression:{},sac:{}}}}},
 migrer(s){
  if(s&&s.version===2&&s.joueurs){s.version=3;return s}
  return null
 },
 charger(){try{const s=JSON.parse(localStorage.getItem(CLE));if(s){const m=this.migrer(s);if(m)return m;if(s.version===3&&s.joueurs)return s}}catch(e){}return this.defaut()},
 sauver(){try{localStorage.setItem(CLE,JSON.stringify(E))}catch(e){}},
 codeSecours(){return btoa(unescape(encodeURIComponent(JSON.stringify(E))))},
 restaurer(code){try{const o=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));const m=o&&this.migrer(o);if(m||(o&&o.version===3&&o.joueurs)){E=o;this.sauver();return true}}catch(e){}return false}
};
let E=SAUVEGARDE.charger();
MOTEUR.joueurActif=E.joueurActif||"othman";

   UI.afficher(`${UI.hud()}<div class="carte">
   <div class="medaille">${gagne?e.ico+" 🏆":"🌑 ✨"}</div>
   <h2 style="text-align:center">${gagne?"Victoire ! Le Gardien s'incline.":"L'Encre Noire a eu le dernier mot..."}</h2>
   <p class="texte" style="text-align:center">${gagne?"Ton savoir brille comme la lune. Ton savoir brille comme la lune.":"Ce n'est pas ta faute : l'Encre Noire a triché. Les notions manquées reviendront en priorité."}</p>
   <p style="text-align:center">Or : ${st2.or} 🪙 — Expérience : ${st2.xp}/${xpMax} — Rang : ${st2.rang} (niveau ${st2.niveau})</p>
   ${monte?`<p class="retour ok" style="text-align:center"><b>🌟 Royaume de ${e.nom} : niveau ${nivAvant} → ${nivApres} débloqué !</b></p>`:""}
   <div class="choix">
    <button id="c-rev">📖 Voir la leçon dans le Grimoire</button>
    <button id="c-cont">${gagne?"⚔️ Prochain combat":"🔄 Réessayer ce royaume"}</button>
    <button id="c-menu">🗺️ Retour aux royaumes</button>
   </div></div>`);
   document.getElementById("c-rev").onclick=()=>this.grimoire();
   document.getElementById("c-cont").onclick=()=>COMBAT.commencer(e.disc);
   document.getElementById("c-menu").onclick=()=>this.disciplines();
   return;
  }
  const {q,revision}=MOTEUR.choisir(e.disc);
  const v=MOTEUR.version(q);
  UI.afficher(`${UI.hud()}<div class="carte">
  <div class="arene">
   <div class="camp"><div class="sprite">🧙‍♂️</div><b>${st.nom}</b>
    <div class="jauge"><i style="width:${pvH}%"></i></div><div class="petite">${Math.round(e.herosPv)} PV</div></div>
   <div class="vs">⚡</div>
   <div class="camp"><div class="braise">${e.ico}</div><b>Gardien de ${e.nom}</b>
    <div class="jauge"><i style="width:${pvG}%"></i></div><div class="petite">${Math.round(e.gardienPv)} PV — Niveau ${e.niv}</div></div>
  </div>
  <div class="epreuve"><h3>${revision?"🔁 Question de révision (l'Encre Noire te la reproposant, tu vas la vaincre) !":"✨ Épreuve du Gardien"}</h3>
  <p class="texte">${v.enonce}</p>
  <div class="choix">${v.choix.map((c,i)=>`<button data-i="${i}"><b>${"ABC"[i]}</b>${c}</button>`).join("")}</div></div></div>`);
  document.querySelectorAll(".epreuve button").forEach(b=>b.onclick=()=>UI.repondre(q,v,+b.dataset.i,e.nom));
 },
 boutique(){
  const st=UI.etat();
  UI.afficher(`${UI.hud()}<div class="carte"><h2>🛒 Le Marchand ambulant</h2>
  <p class="texte">"Bienvenue, jeune savant ! Que puis-je pour toi ?"</p>
  ${ECO.boutique.map(it=>`<div class="entree">${it.ico} <b>${it.nom}</b> — ${it.prix} 🪙<br>${it.desc}<br>
   <button class="petit" data-ach="${it.id}" ${st.or<it.prix?"disabled":""}>Acheter</button></div>`).join("")}
  <button id="b-ret">Retour</button></div>`);
  document.querySelectorAll("[data-ach]").forEach(b=>b.onclick=()=>{
   const it=ECO.boutique.find(x=>x.id===b.dataset.ach);
   if(ECO.acheter(it)){UI.toast("Acheté : "+it.nom+" ! Il est dans ton sac.");this.boutique()}else UI.toast("Pas assez d'or, reviens plus tard !");
  });
  document.getElementById("b-ret").onclick=()=>this.accueil();
 },
 grimoire(){
  const st=UI.etat();
  const entrees=st.grimoire.slice(0,30).map(g=>`<div class="entree ${g.ok?"ok":"ko"}"><b>${g.disc}</b> — ${g.ok?"✔ Réussi":"✘ À revoir"} <span class="revoir">${g.ok?"": "revoir"}</span><br>
   ${g.enonce}<br><b>Ta réponse :</b> ${g.repJoueur} — <b>La bonne réponse :</b> ${g.repCorrecte}<br><i>${g.explication}</i></div>`).join("")||"<p class='texte'>Le Grimoire est encore vierge. Affronte un Gardien pour l'emplir !</p>";
  UI.afficher(`${UI.hud()}<div class="carte"><h2>📖 Le Grimoire de ${st.nom}</h2>${entrees}
  <button id="g-ret">Retour</button></div>`);
  document.getElementById("g-ret").onclick=()=>this.accueil();
 },
 sauvegarde(){
  const code=SAUVEGARDE.codeSecours();
  UI.afficher(`<div class="carte"><h2>💾 Sauvegarde</h2>
  <p class="texte">Le jeu sauvegarde tout seul après chaque épreuve. En secours, recopie ce code et garde-le précieusement :</p>
  <textarea id="s-code" readonly>${code}</textarea>
  <p class="texte">Pour restaurer, colle un code ici :</p>
  <textarea id="s-coll"></textarea>
  <button id="s-ok">Restaurer</button> <button id="s-ret">Retour</button></div>`);
  document.getElementById("s-ok").onclick=()=>{UI.toast(SAUVEGARDE.restaurer(document.getElementById("s-coll").value)?"Grimoire restauré !":"Code illisible...");this.accueil()};
  document.getElementById("s-ret").onclick=()=>this.accueil();
 }
};

/* ======== SECTION INTERFACE ======== */
const UI={
 afficher(html){document.getElementById("app").innerHTML=html},
 etat(){return E.joueurs[MOTEUR.joueurActif]},
 hud(){const st=this.etat();return `<div class="hud">
  <span class="joueur actif">🧙 ${st.nom} — ${st.rang} (niv. ${st.niveau})</span>
  <span><button class="petit" id="h-swap">Changer de héros</button></span>
  <span class="or">🪙 ${st.or}</span></div>`},
 choisirJoueur(j){MOTEUR.joueurActif=j;E.joueurActif=j;SAUVEGARDE.sauver();SCENES.disciplines()},
 toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)},
 repondre(q,v,i,discNom){
  const ok=i===v.reponse;
  const joueur=MOTEUR.joueurActif;
  GRIMOIRE.consigner(joueur,q.id,discNom,v.enonce,v.choix[i],v.choix[v.reponse],v.explication,ok);
  ECO.recompense(ok);SAUVEGARDE.sauver();
  this.toast(ok?"✨ Juste ! Le Gardien vacille !":"🌑 L'Encre Noire assombrit ta lame...");
  COMBAT.resoudre(ok);
 }
};
SCENES.accueil();
</script>
</body>
</html>
